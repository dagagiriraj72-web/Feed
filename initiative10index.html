<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART Goals Strategic Simulator - Bulletproof Standard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* HARD-LOCKED 16:9 STORYLINE PRESENTATION DECK FOOTPRINT
           Locks coordinates exactly at 1280x720. This acts as a fixed physical canvas, 
           permanently preventing container collapse, invisible drops, or vertical bleeding.
        */
        .slide-wrapper {
            width: 1280px;
            height: 720px;
            padding: 40px 50px 30px 50px;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Branded Corporate Header Row */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e2dbd5;
            padding-bottom: 8px;
            flex-shrink: 0;
            height: 60px;
        }

        .main-title {
            font-size: 2.4rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
        }

        .company-branding {
            font-size: 1.1rem;
            font-weight: 800;
            color: #7b9583;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background-color: rgba(123, 149, 131, 0.1);
            padding: 5px 12px;
            border-radius: 4px;
        }

        /* Workspace Matrix Area */
        .workspace-matrix {
            display: flex;
            flex-direction: column;
            height: 520px; /* Rigidly forces workspace open to prevent blank screen drops */
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* Horizontal Selection Ribbon Track Strip */
        .ribbon-navigation-track {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            height: 65px;
            flex-shrink: 0;
            margin-bottom: 15px;
        }

        .business-hub-btn {
            background-color: #e2dbd5;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease;
            height: 100%;
        }

        .hub-index-lbl {
            font-size: 0.72rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hub-title-lbl {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a382c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Active Navigation Tab Highlighting */
        .business-hub-btn.active-tab {
            background-color: #ffffff;
            border-color: #cd674c;
            box-shadow: 0 4px 12px rgba(205, 103, 76, 0.08);
        }
        .business-hub-btn.active-tab .hub-title-lbl { color: #cd674c; }
        .business-hub-btn.active-tab .hub-index-lbl { color: #cd674c; }

        /* Mastered Level Node State Complete Modifiers */
        .business-hub-btn.mastered-tab {
            border-color: #2a9d8f !important;
            background-color: rgba(42, 157, 143, 0.03);
        }
        .business-hub-btn.mastered-tab .hub-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .business-hub-btn.mastered-tab .hub-index-lbl { color: #2a9d8f; }

        /* SINGLE BALANCED INTERACTIVE PLAYGROUND CARD 
           Locks elements within a strict vertical footprint to eliminate layout overlap.
        */
        .unified-arena-card {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 30px;
            height: 440px; /* Locked frame height */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Safe scroll sandbox zone preventing text parameters overflow issues */
        .terminal-scroll-sandbox {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .terminal-scroll-sandbox::-webkit-scrollbar { width: 5px; }
        .terminal-scroll-sandbox::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .arena-tag-heading {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Textbook Core Value Information Block */
        .framework-criterion-box {
            font-size: 1rem;
            font-weight: 600;
            color: #6e5d53;
            background-color: #fdfbf9;
            padding: 12px 20px;
            border-left: 4px solid #cd674c;
            border-radius: 4px;
            line-height: 1.45;
        }

        .challenge-statement-text {
            font-size: 1.22rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.42;
        }

        /* Stacking Options Pipeline Lower Section Base */
        .choices-stack-pipeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            width: 100%;
        }

        .choice-interaction-card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            text-align: left;
            line-height: 1.42;
            transition: all 0.2s ease;
            width: 100%;
        }

        .choice-interaction-card:hover {
            background-color: #fffbf7;
            border-color: #cd674c;
            color: #cd674c;
            transform: translateX(3px);
        }

        /* Phase Clear Success Overlay Component Layer */
        .stage-success-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        .success-heading-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2a9d8f;
        }

        /* Grand Total Campaign Clear Screen Overrides */
        .campaign-clear-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: 12px;
        }

        /* Bottom Fixed Corporate Metrics Row Status Bar */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.08);
            padding-top: 10px;
            height: 40px;
        }

        .score-tracker-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3d2314;
            background-color: #fff8eb;
            padding: 4px 15px;
            border-radius: 20px;
            border: 1px solid #f4a261;
            font-variant-numeric: tabular-nums;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="slide-wrapper">
