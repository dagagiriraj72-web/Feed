<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Group - SMART Goals Strategic Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 STORYLINE PRESENTATION CANVAS MAXIMUM FOOTPRINT
           Locks down layout bounds at 1280x720 to completely eliminate vertical
           bleed, clashing text boxes, or footer regressions in Storyline Web Objects.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 2rem 3.5rem 1.2rem 3.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Confetti Layer Canvas */
        #confetti-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Top Branded Corporate Header Row */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e2dbd5;
            padding-bottom: 0.4rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.4rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
        }

        .company-branding {
            font-size: 1.1rem;
            font-weight: 800;
            color: #7b9583;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background-color: rgba(123, 149, 131, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
        }

        /* Layout Grid Stack Matrix Wrapper */
        .workspace-matrix {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0; /* Dynamic height clip barrier */
            margin: 0.6rem 0;
        }

        /* Horizontal Selection Ribbon Strip Track */
        .ribbon-navigation-track {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.4rem;
            width: 100%;
            flex-shrink: 0;
        }

        .business-hub-btn {
            background-color: #e2dbd5;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-bottom: none;
            padding: 0.75rem 0.5rem;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            transition: all 0.2s ease;
        }

        .hub-index-lbl {
            font-size: 0.7rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hub-title-lbl {
            font-size: 0.92rem;
            font-weight: 700;
            color: #4a382c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Active Navigation Node Highlight States */
        .business-hub-btn.active-tab {
            background-color: #ffffff;
            padding-top: 0.9rem;
            margin-top: -0.15rem;
            box-shadow: 0 -4px 10px rgba(61, 35, 20, 0.03);
            z-index: 2;
        }
        .business-hub-btn[data-id="1"].active-tab, .business-hub-btn[data-id="3"].active-tab, .business-hub-btn[data-id="5"].active-tab { border-top: 4px solid #cd674c; }
        .business-hub-btn[data-id="2"].active-tab, .business-hub-btn[data-id="4"].active-tab { border-top: 4px solid #7b9583; }

        .business-hub-btn.active-tab .hub-title-lbl { color: #cd674c; }
        .business-hub-btn.active-tab[data-id="2"] .hub-title-lbl, .business-hub-btn.active-tab[data-id="4"] .hub-title-lbl { color: #5c7564; }

        /* Mastered Level Node State */
        .business-hub-btn.mastered-tab {
            border-top: 4px solid #2a9d8f !important;
            background-color: rgba(42, 157, 143, 0.03);
        }
        .business-hub-btn.mastered-tab .hub-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .business-hub-btn.mastered-tab .hub-index-lbl { color: #2a9d8f; }

        /* SINGLE SIDE-BY-SIDE SIMULATOR CONSOLE CARD
           Allocates independent horizontal zones ensuring options and text parameter frames never clash.
        */
        .unified-arena-card {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 1.8rem 2.2rem;
            flex-grow: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            top: -1px;
            z-index: 1;
        }

        /* Lateral Split-Screen Viewports Layout */
        .arena-split-view {
            display: none; 
            grid-template-columns: 0.95fr 1.05fr;
            gap: 2.5rem;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .arena-split-view.visible-view {
            display: grid;
        }

        /* Left Split Column: Source Parameter Context Data */
        .arena-brief-column {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .arena-tag-heading {
            font-size: 0.82rem;
            font-weight: 700;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .panel-data-green .arena-tag-heading { color: #5c7564; }

        .framework-criterion-box {
            font-size: 0.96rem;
            font-weight: 600;
            color: #6e5d53;
            background-color: #fdfbf9;
            padding: 0.6rem 1rem;
            border-left: 4px solid #cd674c;
            border-radius: 4px;
            line-height: 1.45;
        }
        .panel-data-green .framework-criterion-box { border-left-color: #7b9583; }

        .challenge-statement-text {
            font-size: 1.18rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.42;
        }

        /* Right Split Column: Choice Options Stacking Pipeline */
        .arena-input-column {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            width: 100%;
        }

        .choice-interaction-card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 1rem 1.2rem;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            text-align: left;
            line-height: 1.4;
            transition: all 0.2s ease;
            width: 100%;
        }

        .choice-interaction-card:hover {
            background-color: #fffdfb;
            border-color: #cd674c;
            color: #cd674c;
            transform: translateX(3px);
        }
        .panel-data-green .choice-interaction-card:hover {
            border-color: #7b9583;
            color: #5c7564;
        }

        /* In-Card Stage Complete Success Screen Overlay Layer */
        .stage-success-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: 0.6rem;
        }

        .stage-success-overlay.visible-success {
            display: flex;
        }

        .success-heading-text {
            font-size: 1.35rem;
            font-weight: 800;
            color: #2a9d8f;
        }

        /* Grand Total Campaign Clear Screen Overrides */
        .campaign-clear-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            gap: 0.8rem;
        }

        .campaign-title-lbl {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a9d8f;
        }

        /* Bottom Fixed Corporate Metrics Row Status Bar */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.08);
            padding-top: 0.6rem;
        }

        .score-tracker-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3d2314;
            background-color: #fff8eb;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            border: 1px solid #f4a261;
            font-variant-numeric: tabular-nums;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="slide-wrapper">
        <canvas id="confetti-layer"></canvas>

        <div class="header-section">
            <h1 class="main-title">SMART Framework Strategic Simulator</h1>
            <span class="company-branding">IB Group</span>
        </div>

        <div class="workspace-matrix">
            
            <div class="ribbon-navigation-track">
                <button class="business-hub-btn active-tab" data-id="1" id="tab-0" onclick="switchDivisionTab(0)">
                    <span class="hub-index-lbl">Specific</span>
                    <span class="hub-title-lbl">Broiler Integration</span>
                </button>
                <button class="business-hub-btn" data-id="2" id="tab-1" onclick="switchDivisionTab(1)">
                    <span class="hub-index-lbl">Measurable</span>
                    <span class="hub-title-lbl">Fish Feed Plant</span>
                </button>
                <button class="business-hub-btn" data-id="3" id="tab-2" onclick="switchDivisionTab(2)">
                    <span class="hub-index-lbl">Achievable</span>
                    <span class="hub-title-lbl">Abis Pro Retail</span>
                </button>
                <button class="business-hub-btn" data-id="4" id="tab-3" onclick="switchDivisionTab(3)">
                    <span class="hub-index-lbl">Relevant</span>
                    <span class="hub-title-lbl">Lynk Sweets</span>
                </button>
                <button class="business-hub-btn" data-id="5" id="tab-4" onclick="switchDivisionTab(4)">
                    <span class="hub-index-lbl">Time-Bound</span>
                    <span class="hub-title-lbl">Abis Edible Oil</span>
                </button>
