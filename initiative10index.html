<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART Framework - Stable Simulation Matrix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* HARD-LOCKED STORYLINE 16:9 VIEWPORT 
           Locks coordinates exactly at 1280x720 to completely fix vertical 
           layout transitions, element crushing, or lower baseline text bleeding.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 2.2rem 3.5rem 1.5rem 3.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Branded Header Row */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e2dbd5;
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.4rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
        }

        .company-branding {
            font-size: 1.1rem;
            font-weight: 800;
            color: #7b9583;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background-color: rgba(123, 149, 131, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
        }

        /* Master Workspace Container Track */
        .workspace-matrix {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0; /* Clear anti-collapse barrier line */
            margin: 1rem 0;
        }

        /* Horizontal Selection Ribbon Track Strip */
        .ribbon-navigation-track {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 1.2rem;
        }

        .business-hub-btn {
            background-color: #e2dbd5;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-radius: 8px;
            padding: 0.75rem 0.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            transition: all 0.2s ease;
        }

        .hub-index-lbl {
            font-size: 0.72rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hub-title-lbl {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a382c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Active Selected Tab States */
        .business-hub-btn.active-tab {
            background-color: #ffffff;
            border-color: #cd674c;
            box-shadow: 0 4px 12px rgba(205, 103, 76, 0.08);
        }
        .business-hub-btn.active-tab .hub-title-lbl { color: #cd674c; }
        .business-hub-btn.active-tab .hub-index-lbl { color: #cd674c; }

        .business-hub-btn.mastered-tab {
            border-color: #2a9d8f !important;
            background-color: rgba(42, 157, 143, 0.03);
        }
        .business-hub-btn.mastered-tab .hub-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .business-hub-btn.mastered-tab .hub-index-lbl { color: #2a9d8f; }

        /* SINGLE BALANCED INTERACTIVE PLAYGROUND CARD 
           Using a stable vertical layout to guarantee zero component overlapping.
        */
        .unified-arena-card {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 1.8rem 2.2rem;
            flex-grow: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Safe scroll sandbox zone preventing text parameters overflow issues */
        .terminal-scroll-sandbox {
            flex-grow: 1;
            min-height: 0;
            max-height: 450px; /* Rigid vertical ceiling constraint */
            overflow-y: auto;
            padding-right: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .terminal-scroll-sandbox::-webkit-scrollbar { width: 5px; }
        .terminal-scroll-sandbox::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .arena-tag-heading {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
