<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Learning Agility Components</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f3f4f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#slide{
width:1280px;
height:720px;
padding:20px;
background:#f3f4f8;
position:relative;
overflow:hidden;
}

/* NAVIGATION */

.nav{
display:flex;
gap:15px;
margin-bottom:15px;
}

.navBtn{
width:220px;
height:70px;
border:none;
border-radius:15px;
font-size:24px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.active{
background:#4d89d8;
color:white;
}

.inactive{
background:white;
color:#222;
}

/* TITLE */

.title{
font-size:52px;
font-weight:800;
color:#2f2f2f;
margin-bottom:15px;
}

/* MAIN */

.main{
display:flex;
justify-content:space-between;
height:520px;
}

/* LEFT PANEL */

.definition{
width:600px;
background:#eef0f5;
border-radius:16px;
padding:40px;
}

.quote{
font-size:34px;
font-weight:700;
font-style:italic;
line-height:1.3;
color:#4d89d8;
margin-bottom:35px;
}

.desc{
font-size:20px;
line-height:1.7;
color:#333;
}

/* RIGHT */

.skills{
width:560px;
display:flex;
flex-direction:column;
justify-content:space-around;
}

.skill{
display:flex;
align-items:flex-start;
cursor:pointer;
padding:10px;
border-radius:12px;
transition:.3s;
}

.skill:hover{
background:white;
}

.dot{
width:52px;
height:52px;
border-radius:50%;
background:#4d89d8;
flex-shrink:0;
margin-right:18px;
}

.skillTitle{
font-size:22px;
font-weight:700;
color:#333;
margin-bottom:5px;
}

.skillDesc{
font-size:16px;
color:#777;
}

/* PROGRESS */

.progress{
position:absolute;
top:25px;
right:20px;
background:white;
padding:10px 15px;
border-radius:10px;
font-weight:700;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

/* POPUP */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
display:none;
z-index:100;
}

.popup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:700px;
background:white;
border-radius:20px;
padding:30px;
display:none;
z-index:101;
}

.popup h2{
font-size:34px;
color:#1d2a7d;
margin-bottom:15px;
}

.popup p{
font-size:20px;
line-height:1.6;
color:#444;
}

.popup button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#4d89d8;
color:white;
cursor:pointer;
}

/* COMPLETE */

.complete{
position:absolute;
inset:0;
background:#131938;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:200;
}

.complete h2{
font-size:58px;
margin-bottom:15px;
}

.complete p{
font-size:22px;
margin-bottom:20px;
}

.complete button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#4d89d8;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="slide">

<div class="progress">
Explored: <span id="count">0</span>/8
</div>

<div class="nav">

<button class="navBtn active"
onclick="loadSection('skill',this)">
1 Skill
</button>

<button class="navBtn inactive"
onclick="loadSection('motivation',this)">
2 Motivation
</button>

</div>

<div class="title" id="title">
Component 1: Skill
</div>

<div class="main">

<div class="definition">

<div class="quote" id="quote">
"What you do when you don't know what to do"
</div>

<div class="desc" id="description">
Applying knowledge and learning to unfamiliar situations while navigating ambiguity and extracting lessons from experience.
</div>

</div>

<div class="skills" id="skills"></div>

</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

<button onclick="closePopup()">Continue</button>

</div>

<div class="complete" id="complete">

<h2>🏆 Learning Agility Expert</h2>

<p>You explored all competencies.</p>

<button onclick="location.reload()">
Restart
</button>

</div>

</div>

<script>

let viewed=[];

const data={

skill:{
title:"Component 1: Skill",
quote:"What you do when you don't know what to do",
description:"Applying knowledge and learning to unfamiliar situations while navigating ambiguity and extracting lessons from experience.",

items:[
["Pattern Recognition","Connecting past experiences to new situations",
"Recognizing patterns helps people apply previous lessons to unfamiliar challenges."],

["Problem Solving","Structuring solutions in unfamiliar territory",
"Breaking problems into manageable parts and identifying solutions."],

["Knowledge Transfer","Applying lessons across different contexts",
"Using learning from one situation in another context."],

["Adaptive Thinking","Adjusting approaches when first attempts fail",
"Changing strategy quickly when circumstances change."]
]
},

motivation:{
title:"Component 2: Motivation",
quote:"The willingness to take risk in novel situations",
description:"Motivation drives people to step into uncertainty rather than remain comfortable.",

items:[
["Curiosity","An intrinsic drive to explore and understand",
"Curious people actively seek opportunities to learn."],

["Courage","Willingness to fail and learn from mistakes",
"Taking action despite uncertainty and setbacks."],

["Initiative","Proactively seeking challenges",
"Acting before being told and pursuing opportunities."],

["Resilience","Bouncing back from setbacks",
"Recovering quickly and continuing forward."]
]
}

};

let current='skill';

function loadSection(type,btn){

current=type;

document.querySelectorAll('.navBtn')
.forEach(b=>{
b.classList.remove('active');
b.classList.add('inactive');
});

btn.classList.remove('inactive');
btn.classList.add('active');

document.getElementById('title').innerHTML=data[type].title;
document.getElementById('quote').innerHTML='"'+data[type].quote+'"';
document.getElementById('description').innerHTML=data[type].description;

let html='';

data[type].items.forEach((item,index)=>{

html+=`
<div class="skill"
onclick="showPopup('${item[0]}','${item[2]}','${type}-${index}')">

<div class="dot"></div>

<div>
<div class="skillTitle">${item[0]}</div>
<div class="skillDesc">${item[1]}</div>
</div>

</div>
`;

});

document.getElementById('skills').innerHTML=html;

}

function showPopup(title,text,id){

document.getElementById('popupTitle').innerHTML=title;
document.getElementById('popupText').innerHTML=text;

document.getElementById('overlay').style.display='block';
document.getElementById('popup').style.display='block';

if(!viewed.includes(id)){

viewed.push(id);

document.getElementById('count').innerHTML=viewed.length;

if(viewed.length===8){

setTimeout(()=>{
document.getElementById('complete').style.display='flex';
},500);

}

}

}

function closePopup(){

document.getElementById('overlay').style.display='none';
document.getElementById('popup').style.display='none';

}

loadSection('skill',document.querySelector('.navBtn'));

</script>

</body>
</html>
