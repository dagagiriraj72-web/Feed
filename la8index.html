<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learning Agility Strategies</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f5f8;
overflow:hidden;
}

#slide{
width:1280px;
height:720px;
margin:auto;
background:#f4f5f8;
position:relative;
overflow:hidden;
}

/* TITLE */

.title{
text-align:center;
font-size:42px;
font-weight:800;
color:#23235b;
padding-top:15px;
}

/* WHEEL */

.wheel{
position:absolute;
left:70px;
top:130px;
width:420px;
height:420px;
}

.center{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:#23235b;
color:white;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-weight:700;
left:150px;
top:150px;
}

.node{
position:absolute;
width:80px;
height:80px;
border-radius:50%;
background:linear-gradient(135deg,#4f8cff,#7c4dff);
color:white;
font-size:30px;
font-weight:700;
border:none;
cursor:pointer;
transition:.3s;
}

.node:hover{
transform:scale(1.1);
}

.n1{top:0;left:170px;}
.n2{top:90px;right:0;}
.n3{bottom:90px;right:0;}
.n4{bottom:0;left:170px;}
.n5{bottom:90px;left:0;}
.n6{top:90px;left:0;}

/* PANEL */

.panel{
position:absolute;
right:40px;
top:120px;
width:650px;
height:500px;
background:white;
border-radius:25px;
padding:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.badge{
display:inline-block;
padding:8px 16px;
background:#eef2ff;
border-radius:20px;
font-weight:700;
color:#4f46e5;
margin-bottom:15px;
}

#heading{
font-size:40px;
font-weight:800;
color:#23235b;
margin-bottom:15px;
}

#desc{
font-size:24px;
line-height:1.6;
color:#4b5563;
margin-bottom:25px;
}

.exampleTitle{
font-size:24px;
font-weight:700;
color:#23235b;
margin-bottom:10px;
}

.example{
background:#eef2ff;
padding:20px;
border-radius:15px;
font-size:22px;
line-height:1.5;
color:#374151;
}

.progressWrap{
margin-top:25px;
}

.progress{
height:12px;
background:#d7dbe8;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#4f8cff,#7c4dff);
transition:.4s;
}

.progressText{
font-size:18px;
font-weight:700;
margin-bottom:8px;
color:#23235b;
}

.complete{
display:none;
margin-top:20px;
background:#23235b;
color:white;
padding:15px;
border-radius:15px;
font-size:22px;
font-weight:700;
text-align:center;
}

</style>
</head>

<body>

<div id="slide">

<div class="title">
Learning Agility Strategies in Practice
</div>

<div class="wheel">

<div class="center">
Learning<br>Agility
</div>

<button class="node n1" onclick="show(0)">1</button>
<button class="node n2" onclick="show(1)">2</button>
<button class="node n3" onclick="show(2)">3</button>
<button class="node n4" onclick="show(3)">4</button>
<button class="node n5" onclick="show(4)">5</button>
<button class="node n6" onclick="show(5)">6</button>

</div>

<div class="panel">

<div class="badge">
Strategy Explorer
</div>

<div id="heading">
Select a Strategy
</div>

<div id="desc">
Click a numbered strategy node to explore practical ways to build learning agility.
</div>

<div class="exampleTitle">
Workplace Example
</div>

<div class="example" id="example">
Choose any strategy from the wheel.
</div>

<div class="progressWrap">

<div class="progressText">
Progress: <span id="count">0</span>/6
</div>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

</div>

<div class="complete" id="complete">
🏆 Learning Agility Champion Unlocked
</div>

</div>

</div>

<script>

const data=[

{
title:"Mindful Awareness",
desc:"Shift from reactive thinking to deliberate thinking before acting.",
example:"Pause and assess emotions before responding to a challenging situation."
},

{
title:"Forecasting",
desc:"Anticipate future skills and capability requirements.",
example:"Encourage team members to attend conferences and cross-train."
},

{
title:"Curiosity & Openness",
desc:"Challenge assumptions and seek alternative perspectives.",
example:"Ask 'What if?' questions during team discussions."
},

{
title:"Feedback Loops",
desc:"Create regular feedback routines and act on insights.",
example:"Hold monthly feedback sessions with peers and managers."
},

{
title:"Structured Reflection",
desc:"Review successes, failures and lessons learned.",
example:"Conduct after-action reviews at project completion."
},

{
title:"Calculated Risk-Taking",
desc:"Encourage experimentation beyond comfort zones.",
example:"Pilot a new process before rolling it out organization-wide."
}

];

let visited=[];

function show(i){

document.getElementById("heading").innerText=data[i].title;
document.getElementById("desc").innerText=data[i].desc;
document.getElementById("example").innerText=data[i].example;

if(!visited.includes(i)){

visited.push(i);

document.getElementById("count").innerText=visited.length;

document.getElementById("fill").style.width=
(visited.length/6*100)+"%";

if(visited.length===6){

document.getElementById("complete").style.display="block";

}

}

}

</script>

</body>
</html>
