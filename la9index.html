<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Organizational Strategies</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f4f5f8;
overflow:hidden;
}

#slide{
width:1280px;
height:720px;
background:#f4f5f8;
padding:15px;
overflow:hidden;
}

.title{
text-align:center;
font-size:42px;
font-weight:800;
color:#23235b;
margin-bottom:10px;
}

.layout{
display:flex;
gap:15px;
height:610px;
}

/* LEFT SIDE */

.menu{
width:360px;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(3,1fr);
gap:12px;
}

.strategy{
background:white;
border:none;
border-radius:18px;
cursor:pointer;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.3s;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.strategy:hover{
transform:translateY(-4px);
}

.strategy.visited{
border:3px solid #22c55e;
}

.num{
width:58px;
height:58px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:700;
color:white;
background:linear-gradient(135deg,#4f8cff,#7c4dff);
margin-bottom:8px;
}

.label{
font-size:15px;
font-weight:700;
text-align:center;
padding:0 6px;
color:#23235b;
}

/* RIGHT PANEL */

.panel{
flex:1;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
}

.badge{
display:inline-block;
padding:8px 16px;
background:#eef2ff;
border-radius:30px;
color:#4f46e5;
font-weight:700;
margin-bottom:15px;
width:max-content;
}

.panel h2{
font-size:34px;
color:#23235b;
margin-bottom:12px;
}

.desc{
font-size:22px;
line-height:1.5;
color:#4b5563;
margin-bottom:25px;
}

.section{
font-size:24px;
font-weight:700;
color:#23235b;
margin-bottom:12px;
}

.example{
background:#eef2ff;
padding:18px;
border-radius:15px;
font-size:22px;
line-height:1.5;
color:#374151;
}

.progressWrap{
margin-top:auto;
}

.progressText{
font-size:18px;
font-weight:700;
margin-bottom:8px;
color:#23235b;
}

.progress{
height:12px;
background:#d7dbe8;
border-radius:30px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#4f8cff,#7c4dff);
transition:.4s;
}

.complete{
position:fixed;
inset:0;
background:rgba(20,20,50,.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:100;
}

.complete h2{
font-size:60px;
margin-bottom:10px;
}

.complete p{
font-size:24px;
}

</style>
</head>
<body>

<div id="slide">

<div class="title">
Nine Organizational Strategies
</div>

<div class="layout">

<div class="menu">

<button class="strategy" onclick="show(0,this)">
<div class="num">1</div>
<div class="label">Hiring Criteria</div>
</button>

<button class="strategy" onclick="show(1,this)">
<div class="num">2</div>
<div class="label">360 Assessments</div>
</button>

<button class="strategy" onclick="show(2,this)">
<div class="num">3</div>
<div class="label">Stretch Assignments</div>
</button>

<button class="strategy" onclick="show(3,this)">
<div class="num">4</div>
<div class="label">Reflection Practices</div>
</button>

<button class="strategy" onclick="show(4,this)">
<div class="num">5</div>
<div class="label">Psychological Safety</div>
</button>

<button class="strategy" onclick="show(5,this)">
<div class="num">6</div>
<div class="label">Targeted Coaching</div>
</button>

<button class="strategy" onclick="show(6,this)">
<div class="num">7</div>
<div class="label">Agility Metrics</div>
</button>

<button class="strategy" onclick="show(7,this)">
<div class="num">8</div>
<div class="label">Internal Mobility</div>
</button>

<button class="strategy" onclick="show(8,this)">
<div class="num">9</div>
<div class="label">Succession Planning</div>
</button>

</div>

<div class="panel">

<div class="badge">Learning Agility Strategy</div>

<h2 id="titleBox">
Select a Strategy
</h2>

<div class="desc" id="descBox">
Click any strategy tile to explore how organizations build a learning-agile culture.
</div>

<div class="section">
Example
</div>

<div class="example" id="exampleBox">
Choose a strategy from the left to begin.
</div>

<div class="progressWrap">

<div class="progressText">
Progress: <span id="count">0</span>/9
</div>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

</div>

</div>

</div>

</div>

<div class="complete" id="complete">
<h2>🏆 Agility Architect</h2>
<p>You explored all 9 organizational strategies.</p>
</div>

<script>

const data=[

["Embed Learning Agility into Hiring",
"Include learning agility indicators in hiring criteria and interviews.",
"Example: Ask candidates how they adapted to unfamiliar situations."],

["360-Degree Assessments",
"Use multi-rater feedback to identify high-potential talent.",
"Example: Gather feedback from managers, peers and direct reports."],

["Stretch Assignments",
"Push leaders into unfamiliar territory through challenging projects.",
"Example: Assign a high performer to lead a new business initiative."],

["Structured Reflection",
"Create formal reflection practices after major projects.",
"Example: Conduct after-action reviews."],

["Psychological Safety",
"Build an environment where experimentation is encouraged.",
"Example: Celebrate learning from mistakes."],

["Targeted Coaching",
"Invest in coaching aligned to agility dimensions.",
"Example: Coaching focused on feedback-seeking behaviour."],

["Agility Metrics",
"Track learning agility indicators alongside performance.",
"Example: Measure adaptability and experimentation."],

["Internal Mobility",
"Promote cross-functional rotations and role movement.",
"Example: Rotate managers across departments."],

["Succession Planning",
"Align succession decisions with learning agility profiles.",
"Example: Prioritize adaptable future leaders."]
];

let visited=[];

function show(i,el){

document.getElementById("titleBox").innerText=data[i][0];
document.getElementById("descBox").innerText=data[i][1];
document.getElementById("exampleBox").innerText=data[i][2];

if(!visited.includes(i)){

visited.push(i);

el.classList.add("visited");

document.getElementById("count").innerText=visited.length;

document.getElementById("fill").style.width=
(visited.length/9*100)+"%";

if(visited.length===9){

setTimeout(()=>{
document.getElementById("complete").style.display="flex";
},700);

}

}

}

</script>

</body>
</html>
