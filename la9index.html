<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Organizational Strategies</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f5f8;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#slide{
width:1280px;
height:720px;
background:#f4f5f8;
padding:20px 30px;
position:relative;
overflow:hidden;
}

h1{
text-align:center;
font-size:48px;
color:#23235b;
margin-bottom:20px;
font-weight:800;
}

.instructions{
text-align:center;
font-size:18px;
color:#666;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(3,150px);
gap:15px;
}

.card{
background:#e9edf7;
border-radius:18px;
cursor:pointer;
padding:18px;
display:flex;
align-items:center;
gap:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.num{
width:60px;
height:60px;
min-width:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:700;
color:white;
}

.purple{
background:linear-gradient(135deg,#7c4dff,#5c6cff);
}

.blue{
background:linear-gradient(135deg,#4f8cff,#3a7cf5);
}

.text{
font-size:24px;
font-weight:700;
line-height:1.2;
color:#23235b;
}

/* POPUP */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:10;
}

.popup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:760px;
background:white;
border-radius:25px;
padding:30px;
display:none;
z-index:11;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.popup h2{
font-size:38px;
color:#23235b;
margin-bottom:15px;
}

.popup p{
font-size:24px;
line-height:1.6;
color:#4b5563;
}

.example{
margin-top:20px;
padding:18px;
background:#eef2ff;
border-radius:15px;
font-size:22px;
color:#374151;
}

.close{
margin-top:20px;
padding:12px 24px;
border:none;
border-radius:10px;
background:#5c6cff;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="slide">

<h1>Nine Organizational Strategies</h1>

<div class="instructions">
Click any organisational strategy to explore it
</div>

<div class="grid">

<div class="card" onclick="openCard(0)">
<div class="num purple">1</div>
<div class="text">Hiring Criteria</div>
</div>

<div class="card" onclick="openCard(1)">
<div class="num purple">2</div>
<div class="text">360 Assessments</div>
</div>

<div class="card" onclick="openCard(2)">
<div class="num blue">3</div>
<div class="text">Stretch Assignments</div>
</div>

<div class="card" onclick="openCard(3)">
<div class="num purple">4</div>
<div class="text">Reflection Practices</div>
</div>

<div class="card" onclick="openCard(4)">
<div class="num blue">5</div>
<div class="text">Psychological Safety</div>
</div>

<div class="card" onclick="openCard(5)">
<div class="num purple">6</div>
<div class="text">Targeted Coaching</div>
</div>

<div class="card" onclick="openCard(6)">
<div class="num purple">7</div>
<div class="text">Agility Metrics</div>
</div>

<div class="card" onclick="openCard(7)">
<div class="num blue">8</div>
<div class="text">Internal Mobility</div>
</div>

<div class="card" onclick="openCard(8)">
<div class="num purple">9</div>
<div class="text">Succession Planning</div>
</div>

</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
<h2 id="title"></h2>
<p id="desc"></p>
<div class="example" id="example"></div>
<button class="close" onclick="closeCard()">Close</button>
</div>

</div>

<script>

const strategies=[

{
title:"Embed Learning Agility into Hiring Criteria",
desc:"Include learning agility indicators in recruitment and interview processes.",
example:"Ask candidates to describe how they adapted to a completely unfamiliar challenge."
},

{
title:"360-Degree Assessments",
desc:"Use feedback from peers, managers and direct reports to identify high-potential talent.",
example:"Gather multi-rater feedback before succession planning discussions."
},

{
title:"Stretch Assignments",
desc:"Provide assignments that push leaders into unfamiliar situations.",
example:"Assign a finance manager to lead a cross-functional transformation project."
},

{
title:"Reflection Practices",
desc:"Build structured reflection into projects and learning experiences.",
example:"Conduct after-action reviews at project completion."
},

{
title:"Psychological Safety",
desc:"Create an environment where experimentation is encouraged.",
example:"Celebrate lessons learned from intelligent failures."
},

{
title:"Targeted Coaching",
desc:"Provide coaching focused on specific learning agility dimensions.",
example:"Coach leaders on feedback-seeking and adaptability behaviours."
},

{
title:"Agility Metrics",
desc:"Measure learning agility alongside performance outcomes.",
example:"Track adaptability and innovation metrics in performance reviews."
},

{
title:"Internal Mobility",
desc:"Encourage role rotations and cross-functional movement.",
example:"Move leaders across departments to broaden experiences."
},

{
title:"Succession Planning",
desc:"Use learning agility profiles to identify future leaders.",
example:"Select high-potential employees who consistently learn quickly."
}

];

function openCard(index){

document.getElementById("title").innerText=strategies[index].title;
document.getElementById("desc").innerText=strategies[index].desc;
document.getElementById("example").innerHTML="<strong>Example:</strong> "+strategies[index].example;

document.getElementById("overlay").style.display="block";
document.getElementById("popup").style.display="block";
}

function closeCard(){
document.getElementById("overlay").style.display="none";
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
