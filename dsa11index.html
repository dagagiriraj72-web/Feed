<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Principles of a Decisive Culture - Storyline Safe Layout</title>
    
    <style>
        /* ==========================================================================
           1. Core Reset & Fixed 16:9 Canvas Constraints (Absolute No-Scroll Gate)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f2537; /* Matching the deep slate blue theme of image_fee2c7.png */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 5px;
        }

        /* Fixed 16:9 Slide Canvas Bounding Box Container - Tight Padding Protection */
        .slide-container {
            background-color: #162e44;
            width: 1280px;
            height: 720px;
            padding: 30px 45px 20px 45px; /* Reclaims critical vertical limits */
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; 
        }

        /* ==========================================================================
           2. Slide Header and Interactive HUD Display Panel
           ========================================================================== */
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .hud-metrics {
            display: flex;
            gap: 12px;
        }

        .metric-pill {
            background-color: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #e67e22; /* Vibrant orange contrast accent tone from your layout */
            border: 1px solid rgba(230, 126, 34, 0.3);
        }

        /* ==========================================================================
           3. Core Gameplay Arena Framework (Side-by-Side Horizontal Balance)
           ========================================================================== */
        .gameplay-arena {
            display: flex;
            gap: 25px;
            flex: 1;
            margin: 20px 0 15px 0;
            align-items: stretch;
            height: calc(100% - 135px);
        }

        /* Left Split: Dynamic Friction Sidebar Monitor Column */
        .sidebar-friction-panel {
            flex: 0.85;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .sidebar-friction-panel h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #e67e22;
            margin-bottom: 6px;
        }

        .sidebar-friction-panel p {
            font-size: 1.12rem;
            line-height: 1.45;
            color: #ffffff;
            font-weight: 600;
        }

        /* Right Split: Parallel Target Node List Menu Box */
        .principles-sidebar {
            flex: 1.15;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Highly compact gap properties safeguard from cuts */
            justify-content: center;
        }

        .principle-node-btn {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .principle-node-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #e67e22;
            transform: translateX(4px);
        }

        .node-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: #e67e22;
            width: 25px;
            flex-shrink: 0;
        }

        .node-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Solved State active locks */
        .principle-node-btn.solved-complete {
            background-color: rgba(46, 204, 113, 0.1);
            border-color: #2ecc71;
            cursor: default;
            pointer-events: none;
            transform: none;
        }
        .principle-node-btn.solved-complete .node-number {
            color: #2ecc71;
        }

        /* ==========================================================================
           4. Game End Mastery Dashboard Layout Overlay Viewport
           ========================================================================== */
        .mastery-dashboard-overlay {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            animation: overlayEntrance 0.4s ease-out both;
            margin: 15px 0;
        }

        .static-framework-row {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            min-height: 64px;
        }

        .static-num {
            font-size: 1.5rem;
            font-weight: 800;
            color: #e67e22;
            width: 50px;
            flex-shrink: 0;
        }

        .static-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            width: 280px;
            flex-shrink: 0;
            padding-right: 15px;
        }

        .static-desc {
            font-size: 0.95rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ==========================================================================
           5. Slide Footer Component
           ========================================================================== */
        .slide-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .slide-footer p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        @keyframes overlayEntrance {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="slide-container">
        
        <header class="slide-header
