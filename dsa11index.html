<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Principles of a Decisive Culture - Anti-Clipping Edition</title>
    <style>
        /* FORCE WINDOW METRICS TO OCCUPY 100% OF THE IFRAME CANVAS NATIVELY */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f1d2a; /* Deep navy background from image assets */
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* FLUID 16:9 VIEWPORT PRESTRAINT HULL
           Replaces rigid wide pixel boundaries with an aspect-ratio calculation. 
           This leaves a padding safety buffer on the right edge to stop any dynamic clipping.
        */
        .slide-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96%;
            height: 94%;
            max-width: 1200px; /* Slightly narrower baseline completely eliminates right margin cuts */
            aspect-ratio: 16 / 9;
            padding: 2.2rem 2.5rem;
            background-color: #122232; /* Deep slate theme canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            border-radius: 8px;
        }

        /* Slide Title Header */
        .header-section {
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.6rem;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.4rem;
            color: #ffffff;
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
        }

        /* LATERAL SPLIT ARCHITECTURE PLAYGROUND
           Core Fix: Pulls long tab titles into a clean vertical sidebar layout 
           so they cannot squeeze each other off the right edge of the screen.
        */
        .workspace-matrix {
            display: grid;
            grid-template-columns: 280px 1fr; /* Fixed sidebar layout width handles text boundaries perfectly */
            gap: 2rem;
            flex-grow: 1;
            min-height: 0; /* Clear anti-collapse barrier line */
            align-items: stretch;
        }

        /* Left Column Sidebar: Interactive Principle Navigation Stack */
        .tabs-vertical-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .principle-nav-btn {
            background-color: #1b3249;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 0.9rem 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .principle-nav-btn:hover {
            background-color: #233e5b;
            transform: translateX(3px);
        }

        .btn-index-num {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f39c12; /* Amber orange index badge */
            font-variant-numeric: tabular-nums;
        }

        .btn-title-lbl {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Active Selected Navigation Tab Highlighting */
        .principle-nav-btn.active-tab {
            background-color: #ffffff !important;
            border-color: #f39c12;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.15);
        }
        .principle-nav-btn.active-tab .btn-title-lbl { color: #122232; }
        .principle-nav-btn.active-tab .btn-index-num { color: #122232; }

        /* Mastered Level Node State Complete Modifiers */
        .principle-nav-btn.mastered-tab {
            border-color: #2a9d8f !important;
            background-color: rgba(42, 157, 143, 0.15);
        }
        .principle-nav-btn.mastered-tab .btn-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .principle-nav-btn.mastered-tab .btn-index-num { color: #2a9d8f; }

        /* Right Column Dashboard: Content Window Presentation Card */
        .unified-arena-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            padding: 1.8rem 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            box-sizing: border-box;
        }

        /* Internal vertical scroll block isolating texts from lower buttons */
        .terminal-scroll-sandbox {
            flex-grow: 1;
            min-height: 0;
            max-height: 380px; /* Secure framing ceiling blocks lower component crashes */
            overflow-y: auto;
            padding-right: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .terminal-scroll-sandbox::-webkit-scrollbar { width: 4px; }
        .terminal-scroll-sandbox::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .arena-tag-heading {
            font-size: 0.85rem;
            font-weight: 800;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Blueprint Framework Context Rule Box */
        .framework-criterion-box {

            font-weight: 600;
            color: #5c6b73;
            background-color: #fcfbf9;
            padding: 0.75rem 1.2rem;
            border-left: 4px solid #122232;
            border-radius: 4px;
            line-height: 1.45;
        }

        .challenge-statement-text {
            font-size: 1.22rem;
            font-weight: 700;
            color: #122232;
            line-height: 1.42;
            margin: 0;
        }

        /* Stacking Interactive Choices Options Pipeline */
        .choices-stack-pipeline {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: auto;
            padding-top: 1rem;
            flex-shrink: 0;
            width: 100%;
        }

        .choice-interaction-card {
            background-color: #ffffff;
            border: 2px solid #e2dbd5;
            padding: 1.1rem 1.4rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            text-align: left;
            line-height: 1.42;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .choice-interaction-card:hover {
            background-color: #fffbf7;
            border-color: #f39c12;
            color: #122232;
            transform: translateX(4px);
        }

        /* Step Complete Success Inner Overlay Card Component Layer */
        .stage-success-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: 0.6rem;
        }

        .success-heading-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2a9d8f;
        }

        .campaign-clear-panel {
