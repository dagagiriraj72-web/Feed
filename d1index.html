<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisiveness vs. Impulsiveness - Balanced HUD Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 PRESENTATION CANVAS MAXIMUM FOOTPRINT 
           Strictly isolates slide boundaries to preserve layout dimensions without cropping.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 2.2rem 3.5rem 1.2rem 3.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Title Header */
        .header-section {
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.6rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-bottom: 0.4rem;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 4px;
            background-color: #7b9583;
            border-radius: 2px;
        }

        /* Stable Main Grid Workspace */
        .workspace-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            flex-grow: 1;
            min-height: 0; 
            margin: 1rem 0;
            align-items: stretch;
            position: relative;
            z-index: 1;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        /* Target Content Placement Buckets Columns */
        .sorting-bucket-column {
            background-color: #f1ede9;
            border-radius: 12px;
            border: 1px solid rgba(61, 35, 20, 0.05);
            padding: 1.5rem 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            height: 100%;
            min-height: 0;
        }

        .bucket-heading {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3d2314;
            border-bottom: 2px solid rgba(61, 35, 20, 0.08);
            padding-bottom: 0.5rem;
            margin-bottom: 0.4rem;
            flex-shrink: 0;
        }

        /* Sorted list items row tracks wrapper */
        .sorted-items-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* Placed Text Trait Element styling */
        .placed-trait-node {
            background-color: #ffffff;
            border-radius: 6px;
            padding: 0.6rem 1rem;
            font-size: 0.92rem;
            font-weight: 600;
            color: #4a382c;
            border: 1px solid rgba(61, 35, 20, 0.06);
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
            animation: slideInNode 0.25s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .placed-trait-node::before {
            content: "•";
            color: #7b9583;
            font-weight: 900;
            font-size: 1.2rem;
        }

        #bucket-impulsiveness .placed-trait-node::before {
            color: #cd674c;
        }

        @keyframes slideInNode {
            from { transform: translateY(4px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* INTERACTIVE FLOATING CONSOLE CARD HUD */
        .deck-hud-overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -46%);
            width: 380px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(61, 35, 20, 0.12);
            box-shadow: 0 10px 35px rgba(61, 35, 20, 0.16);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .hud-tag {
            font-size: 0.78rem;
            font-weight: 800;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-display-box {
            background-color: #fffdfb;
            border: 2px dashed rgba(205, 103, 76, 0.4);
            border-radius: 8px;
            padding: 1.2rem 1rem;
            width: 100%;
            min-height: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .trait-statement-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.4;
        }

        /* Controls Layout Buttons */
        .hud-action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            width: 100%;
        }

        .action-click-btn {
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-click-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-left  { background-color: #7b9583; } 
        .btn-right { background-color: #cd674c; } 

        /* ANTI-OVERLAP ABSOLUTE VICTORY VEIL
           Isolates final screens from background items to block collisions.
        */
        .master-victory-veil {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(253, 250, 246, 0.85);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1.2rem;
            border-radius: 12px;
            animation: fadeInVeil 0.4s ease forwards;
        }

        @keyframes fadeInVeil {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .victory-badge-box {
            background: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.1);
            padding: 2.5rem 3.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(61, 35, 20, 0.08);
            max-width: 480px;
            transform: scale(0.92);
            animation: scaleUpBadge 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        @keyframes scaleUpBadge {
            to { transform: scale(1); }
        }

        .victory-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2a9d8f;
            margin-top: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .victory-desc {
            color: #6e5d53; 
            font-size: 1rem; 
            line-height: 1.45;
            font-weight: 500;
        }

        /* Bottom Status Info Strip Row */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.08);
            padding-top: 0.6rem;
            margin-top: 0.2rem;
            position: relative;
            z-index
