<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Agility & Results Agility</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f1ed;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.slide{
width:1280px;
height:720px;
background:#f4f1ed;
padding:20px 25px;
overflow:hidden;
}

.title{
font-size:48px;
font-weight:700;
text-align:center;
color:#1f2f5a;
margin-bottom:15px;
}

.container{
display:flex;
gap:20px;
height:620px;
}

/* LEFT PANEL */

.leftPanel{
width:320px;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.instruction{
font-size:18px;
font-weight:600;
text-align:center;
color:#777;
margin-bottom:20px;
}

.dimension{
display:flex;
align-items:center;
gap:15px;
padding:15px;
border-radius:15px;
cursor:pointer;
margin-bottom:15px;
transition:.3s;
}

.dimension:hover{
background:#f7f7f7;
}

.dimension.active{
background:#eef3ff;
border-left:5px solid #1f2f5a;
}

.icon{
width:65px;
height:65px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
color:white;
flex-shrink:0;
}

.change{
background:#3f9a87;
}

.results{
background:#5c69c7;
}

.dimensionText{
font-size:26px;
font-weight:700;
color:#1f2f5a;
}

/* RIGHT PANEL */

.rightPanel{
flex:1;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
overflow:hidden;
}

.heading{
font-size:40px;
font-weight:700;
color:#1f2f5a;
margin-bottom:5px;
}

.subHeading{
font-size:20px;
font-style:italic;
color:#666;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.card{
background:#f7f8ff;
border-radius:15px;
padding:18px;
cursor:pointer;
transition:.3s;
border:2px solid transparent;
}

.card:hover{
transform:translateY(-3px);
border-color:#1f2f5a;
}

.cardTitle{
font-size:22px;
font-weight:700;
color:#1f2f5a;
}

.detailBox{
height:220px;
background:#f9f9f9;
border-radius:15px;
padding:25px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:28px;
line-height:1.5;
color:#444;
}

</style>
</head>

<body>

<div class="slide">

<div class="title">
Change Agility & Results Agility
</div>

<div class="container">

<div class="leftPanel">

<div class="instruction">
Click a dimension to explore
</div>

<div class="dimension active" onclick="showDimension('change',this)">
<div class="icon change">🔄</div>
<div class="dimensionText">Change Agility</div>
</div>

<div class="dimension" onclick="showDimension('results',this)">
<div class="icon results">🎯</div>
<div class="dimensionText">Results Agility</div>
</div>

</div>

<div class="rightPanel">

<div id="content">

<div class="heading">
Change Agility
</div>

<div class="subHeading">
Embracing and driving change
</div>

<div class="cards">

<div class="card" onclick="showDetail('growth')">
<div class="cardTitle">
🌱 Opportunities for Growth
</div>
</div>

<div class="card" onclick="showDetail('change')">
<div class="cardTitle">
🚀 Drives Change
</div>
</div>

<div class="card" onclick="showDetail('experiment')">
<div class="cardTitle">
🧪 Experiments Fearlessly
</div>
</div>

<div class="card" onclick="showDetail('status')">
<div class="cardTitle">
💡 Challenges Status Quo
</div>
</div>

</div>

<div class="detailBox" id="detailBox">

Click a card to learn more.

</div>

</div>

</div>

</div>

</div>

<script>

function showDimension(type,el){

document.querySelectorAll('.dimension').forEach(d=>{
d.classList.remove('active');
});

el.classList.add('active');

if(type==="change"){

document.getElementById('content').innerHTML=`

<div class="heading">Change Agility</div>

<div class="subHeading">
Embracing and driving change
</div>

<div class="cards">

<div class="card" onclick="showDetail('growth')">
<div class="cardTitle">🌱 Opportunities for Growth</div>
</div>

<div class="card" onclick="showDetail('change')">
<div class="cardTitle">🚀 Drives Change</div>
</div>

<div class="card" onclick="showDetail('experiment')">
<div class="cardTitle">🧪 Experiments Fearlessly</div>
</div>

<div class="card" onclick="showDetail('status')">
<div class="cardTitle">💡 Challenges Status Quo</div>
</div>

</div>

<div class="detailBox" id="detailBox">
Click a card to learn more.
</div>

`;

}

if(type==="results"){

document.getElementById('content').innerHTML=`

<div class="heading">Results Agility</div>

<div class="subHeading">
Delivering results in new conditions
</div>

<div class="cards">

<div class="card" onclick="showDetail('deliver')">
<div class="cardTitle">🏆 Delivers Results</div>
</div>

<div class="card" onclick="showDetail('teams')">
<div class="cardTitle">👥 Builds Teams</div>
</div>

<div class="card" onclick="showDetail('resilience')">
<div class="cardTitle">💪 Resilience</div>
</div>

<div class="card" onclick="showDetail('outcomes')">
<div class="cardTitle">🎯 Focus on Outcomes</div>
</div>

</div>

<div class="detailBox" id="detailBox">
Click a card to learn more.
</div>

`;

}

}

function showDetail(type){

const details={

growth:"Sees challenges as opportunities for growth and development.",

change:"Champions and drives organizational change.",

experiment:"Experiments with new approaches and learns quickly from experience.",

status:"Challenges the status quo constructively and seeks better methods.",

deliver:"Delivers results even in first-time and difficult situations.",

teams:"Builds high-performing teams under pressure.",

resilience:"Demonstrates resilience and resourcefulness during uncertainty.",

outcomes:"Focuses on outcomes rather than simply completing activities."

};

document.getElementById("detailBox").innerHTML=details[type];

}

</script>

</body>
</html>
