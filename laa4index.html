<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Research Journey</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;
background:#f3f4f8;
display:flex;
justify-content:center;
align-items:center;
}

#slide{
width:1280px;
height:720px;
background:#f3f4f8;
padding:25px;
overflow:hidden;
}

h1{
font-size:42px;
font-weight:800;
color:#1f235d;
text-align:center;
margin-bottom:20px;
}

.wrapper{
display:flex;
gap:20px;
height:620px;
}

/* LEFT TIMELINE */

.timeline{
width:320px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.year-btn{
height:95px;
border:none;
cursor:pointer;
border-radius:14px;
background:white;
display:flex;
align-items:center;
padding:15px;
transition:.3s;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.year-btn:hover{
transform:translateX(6px);
}

.year{
width:70px;
height:70px;
border-radius:50%;
background:#4d8fe3;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:700;
margin-right:18px;
}

.year-label{
font-size:20px;
font-weight:700;
color:#1f235d;
}

.active{
background:#4d8fe3;
}

.active .year{
background:white;
color:#4d8fe3;
}

.active .year-label{
color:white;
}

/* RIGHT PANEL */

.content{
flex:1;
background:white;
border-radius:20px;
padding:35px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
}

.badge{
display:inline-block;
background:#e9efff;
color:#4d5cff;
font-weight:700;
padding:10px 18px;
border-radius:30px;
margin-bottom:20px;
font-size:18px;
width:max-content;
}

#yearTitle{
font-size:54px;
font-weight:800;
color:#1f235d;
margin-bottom:15px;
}

#yearDesc{
font-size:28px;
line-height:1.5;
color:#475569;
}

.progress{
margin-top:auto;
}

.progress-label{
font-size:18px;
font-weight:600;
color:#1f235d;
margin-bottom:10px;
}

.bar{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:20%;
background:linear-gradient(90deg,#4d8fe3,#6f5cff);
transition:.4s;
}
</style>
</head>

<body>

<div id="slide">

<h1>The Research Journey</h1>

<div class="wrapper">

<div class="timeline">

<button class="year-btn active" onclick="showData(0,this)">
<div class="year">2012</div>
<div class="year-label">Foundation</div>
</button>

<button class="year-btn" onclick="showData(1,this)">
<div class="year">2015</div>
<div class="year-label">Expansion</div>
</button>

<button class="year-btn" onclick="showData(2,this)">
<div class="year">2015</div>
<div class="year-label">Launch</div>
</button>

<button class="year-btn" onclick="showData(3,this)">
<div class="year">2017</div>
<div class="year-label">Publication</div>
</button>

<button class="year-btn" onclick="showData(4,this)">
<div class="year">2022</div>
<div class="year-label">Development</div>
</button>

</div>

<div class="content">

<div class="badge">Learning Agility Research</div>

<div id="yearTitle">2012</div>

<div id="yearDesc">
DeRue, Ashford and Myers identified Speed and Flexibility as two foundational dimensions of Learning Agility.
</div>

<div class="progress">
<div class="progress-label">Research Timeline Progress</div>
<div class="bar">
<div class="fill" id="fill"></div>
</div>
</div>

</div>

</div>
</div>

<script>

const data=[

{
year:"2012",
text:"DeRue, Ashford and Myers identified Speed and Flexibility as two foundational dimensions of Learning Agility."
},

{
year:"2015",
text:"Burke and doctoral students at Columbia identified seven additional dimensions, creating the nine-dimension model."
},

{
year:"2015",
text:"The Burke Learning Agility Inventory (Burke LAI) was launched as a validated 360-degree assessment."
},

{
year:"2017",
text:"Learning Agility: The Key to Leader Potential was published, providing a comprehensive framework."
},

{
year:"2022",
text:"Developing Learning Agility was published, offering practical methods for developing the 38 behaviors."
}

];

function showData(index,btn){

document.getElementById("yearTitle").innerText=data[index].year;
document.getElementById("yearDesc").innerText=data[index].text;

document.querySelectorAll(".year-btn").forEach(x=>{
x.classList.remove("active");
});

btn.classList.add("active");

document.getElementById("fill").style.width=((index+1)/5)*100+"%";
}

</script>

</body>
</html>
