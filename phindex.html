<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>दिनभर pH में होने वाले बदलाव</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Nirmala UI",sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#d8effb;
}

#container{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
padding:1%;
}

/* HEADER */

.header{
height:14%;
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
}

.header h1{
font-size:clamp(24px,3vw,52px);
color:#005a9c;
}

.header p{
font-size:clamp(14px,1.2vw,22px);
color:#555;
}

/* CONTENT */

.content{
flex:1;
display:grid;
grid-template-columns:72% 28%;
gap:1.5%;
}

/* POND */

.pond{
position:relative;
border-radius:25px;
overflow:hidden;
background:linear-gradient(#7ec9f3,#1597e5);
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.sky{
height:45%;
background:linear-gradient(#7ec9f3,#63b8eb);
position:relative;
}

.water{
height:55%;
background:linear-gradient(#35a8e8,#0d87ca);
}

.sun{
position:absolute;
right:6%;
top:10%;
font-size:clamp(40px,5vw,80px);
}

.fish{
position:absolute;
left:50%;
top:60%;
transform:translate(-50%,-50%);
font-size:clamp(50px,8vw,120px);
animation:swim 4s infinite alternate;
}

@keyframes swim{
from{transform:translate(-55%,-50%);}
to{transform:translate(-45%,-50%);}
}

/* INFO */

.panel{
background:#fff;
border-radius:25px;
padding:4%;
display:flex;
flex-direction:column;
justify-content:space-between;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.phbox{
background:#eef8ff;
border-radius:18px;
padding:4%;
text-align:center;
}

.phbox h3{
font-size:clamp(14px,1.2vw,22px);
}

.ph{
font-size:clamp(40px,5vw,80px);
font-weight:bold;
color:#0077cc;
}

.stageTitle{
font-size:clamp(20px,2vw,34px);
color:#005a9c;
font-weight:bold;
margin-top:15px;
}

.desc{
font-size:clamp(14px,1.3vw,24px);
line-height:1.5;
margin-top:15px;
}

/* BUTTONS */

.timeline{
height:14%;
display:flex;
justify-content:center;
align-items:center;
gap:1%;
margin-top:1%;
}

.btn{
border:none;
cursor:pointer;
border-radius:14px;
background:white;
padding:10px;
min-width:150px;
font-size:clamp(14px,1vw,20px);
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.15);
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.btn.active{
background:#0077cc;
color:white;
}

/* SUMMARY */

.summary{
position:absolute;
left:50%;
bottom:2%;
transform:translateX(-50%);
background:#198754;
color:white;
padding:12px 28px;
border-radius:40px;
font-size:clamp(14px,1vw,22px);
display:none;
}

</style>
</head>

<body>

<div id="container">

<div class="header">
<h1>दिनभर pH में होने वाले बदलाव</h1>
<p>समय के अनुसार pH में होने वाले परिवर्तन को समझें</p>
</div>

<div class="content">

<div class="pond">

<div class="sky">
<div class="sun" id="icon">🌅</div>
</div>

<div class="water"></div>

<div class="fish">🐟</div>

</div>

<div class="panel">

<div>

<div class="phbox">
<h3>वर्तमान pH</h3>
<div class="ph" id="phValue">7.5</div>
</div>

<div class="stageTitle" id="title">
🌅 सूर्योदय
</div>

<div class="desc" id="desc">
रातभर श्वसन होने के कारण इस समय pH सबसे कम होता है।
</div>

</div>

</div>

</div>

<div class="timeline">

<button class="btn" onclick="showStage(0,this)">🌅 सूर्योदय</button>
<button class="btn" onclick="showStage(1,this)">☀️ सुबह</button>
<button class="btn" onclick="showStage(2,this)">🌞 दोपहर</button>
<button class="btn" onclick="showStage(3,this)">🌇 शाम</button>
<button class="btn" onclick="showStage(4,this)">🌙 रात</button>

</div>

</div>

<div class="summary" id="summary">
🏆 मुख्य सीख: दिन में pH बढ़ता है और रात में घटता है।
</div>

<script>

const stages=[

{
icon:"🌅",
title:"सूर्योदय",
ph:"7.5",
desc:"रातभर श्वसन होने के कारण इस समय pH सबसे कम होता है।"
},

{
icon:"☀️",
title:"सुबह",
ph:"8.0",
desc:"सूरज निकलने के बाद पौधे सक्रिय होने लगते हैं और pH बढ़ने लगता है।"
},

{
icon:"🌞",
title:"दोपहर",
ph:"8.8",
desc:"अधिक रोशनी के कारण pH तेजी से बढ़ता है।"
},

{
icon:"🌇",
title:"शाम",
ph:"9.5",
desc:"दिन का सबसे अधिक pH स्तर आमतौर पर शाम के समय देखा जाता है।"
},

{
icon:"🌙",
title:"रात",
ph:"7.8",
desc:"रात में प्रकाश संश्लेषण रुक जाता है और pH फिर कम होने लगता है।"
}

];

let visited=[false,false,false,false,false];

function showStage(i,btn){

document.getElementById("icon").innerHTML=stages[i].icon;
document.getElementById("title").innerHTML=stages[i].icon+" "+stages[i].title;
document.getElementById("phValue").innerHTML=stages[i].ph;
document.getElementById("desc").innerHTML=stages[i].desc;

document.querySelectorAll(".btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

visited[i]=true;

if(visited.every(v=>v)){
document.getElementById("summary").style.display="block";
}

}

</script>

</body>
</html>
