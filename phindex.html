<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>दिनभर pH में बदलाव</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Nirmala UI",sans-serif;
}

body{
background:#dff3ff;
overflow:hidden;
}

.container{
width:1280px;
height:720px;
margin:auto;
position:relative;
background:linear-gradient(to bottom,#87ceeb,#dff3ff);
overflow:hidden;
}

/* HEADER */

.header{
height:90px;
text-align:center;
padding-top:20px;
}

.header h1{
font-size:42px;
color:#005a9c;
}

.header p{
font-size:20px;
color:#444;
}

/* POND */

.scene{
position:absolute;
top:110px;
left:40px;
width:700px;
height:380px;
border-radius:20px;
overflow:hidden;
background:linear-gradient(#87CEEB,#00A2FF);
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.sun{
position:absolute;
top:25px;
right:40px;
font-size:80px;
transition:.5s;
}

.water{
position:absolute;
bottom:0;
width:100%;
height:220px;
background:linear-gradient(#38bdf8,#0284c7);
}

.fish{
position:absolute;
left:280px;
top:180px;
font-size:90px;
animation:swim 5s infinite alternate;
}

@keyframes swim{
from{transform:translateX(-50px);}
to{transform:translateX(50px);}
}

/* INFO */

.info{
position:absolute;
right:40px;
top:110px;
width:450px;
height:380px;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.phBox{
text-align:center;
padding:15px;
background:#eaf7ff;
border-radius:15px;
margin-bottom:20px;
}

.phValue{
font-size:70px;
font-weight:bold;
color:#0077cc;
}

.info h2{
color:#005a9c;
margin-bottom:15px;
}

.info p{
font-size:24px;
line-height:1.6;
}

/* TIMELINE */

.timeline{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
}

.timeBtn{
width:180px;
height:80px;
border:none;
border-radius:15px;
cursor:pointer;
font-size:22px;
font-weight:bold;
background:white;
box-shadow:0 4px 10px rgba(0,0,0,.15);
transition:.3s;
}

.timeBtn:hover{
transform:translateY(-5px);
}

/* COMPLETION */

.complete{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#198754;
color:white;
padding:18px 35px;
font-size:24px;
border-radius:50px;
display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>दिनभर pH में होने वाले बदलाव</h1>
<p>समय के अनुसार pH में होने वाले परिवर्तन को समझें</p>
</div>

<div class="scene">

<div class="sun" id="sun">🌅</div>

<div class="water"></div>

<div class="fish">🐟</div>

</div>

<div class="info">

<div class="phBox">

<div>वर्तमान pH</div>

<div class="phValue" id="ph">
7.5
</div>

</div>

<h2 id="title">
🌅 सूर्योदय
</h2>

<p id="desc">
रातभर श्वसन होने के कारण इस समय pH सबसे कम होता है।
</p>

</div>

<div class="timeline">

<button class="timeBtn"
onclick="showStage(0)">
🌅<br>सूर्योदय
</button>

<button class="timeBtn"
onclick="showStage(1)">
☀️<br>सुबह
</button>

<button class="timeBtn"
onclick="showStage(2)">
🌞<br>दोपहर
</button>

<button class="timeBtn"
onclick="showStage(3)">
🌇<br>शाम
</button>

<button class="timeBtn"
onclick="showStage(4)">
🌙<br>रात
</button>

</div>

<div class="complete" id="complete">

🏆 मुख्य सीख: दिन में pH बढ़ता है और रात में घटता है। इसलिए pH की जाँच सुबह और शाम दोनों समय करनी चाहिए।

</div>

</div>

<script>

let visited=[false,false,false,false,false];

const stages=[

{
icon:"🌅",
title:"सूर्योदय",
ph:"7.5",
desc:"रातभर श्वसन होने के कारण इस समय pH सबसे कम होता है।"
},

{
icon:"☀️",
title:"सुबह",
ph:"8.0",
desc:"सूरज की रोशनी बढ़ने लगती है। पौधे भोजन बनाना शुरू करते हैं।"
},

{
icon:"🌞",
title:"दोपहर",
ph:"8.8",
desc:"अधिक प्रकाश के कारण pH तेजी से बढ़ने लगता है।"
},

{
icon:"🌇",
title:"शाम",
ph:"9.5",
desc:"यह दिन का सबसे अधिक pH स्तर होता है।"
},

{
icon:"🌙",
title:"रात",
ph:"7.8",
desc:"प्रकाश संश्लेषण रुक जाता है और pH फिर कम होने लगता है।"
}

];

function showStage(i){

visited[i]=true;

document.getElementById("sun").innerHTML=
stages[i].icon;

document.getElementById("ph").innerHTML=
stages[i].ph;

document.getElementById("title").innerHTML=
stages[i].icon+" "+stages[i].title;

document.getElementById("desc").innerHTML=
stages[i].desc;

if(visited.every(v=>v)){

document.getElementById("complete")
.style.display="block";

}

}

</script>

</body>
</html>
