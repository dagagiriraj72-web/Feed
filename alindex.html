<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>क्षारीयता और pH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nirmala UI',sans-serif;
}

body{
background:#eef8ff;
overflow:hidden;
}

.container{
width:1280px;
height:720px;
margin:auto;
position:relative;
background:linear-gradient(#f5fbff,#dcefff);
}

.title{
text-align:center;
padding:20px;
font-size:42px;
font-weight:bold;
color:#005fa3;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:10px;
}

.level{
width:180px;
height:70px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;
color:white;
transition:.3s;
}

.level:hover{
transform:translateY(-5px);
}

.l1{background:#d9534f;}
.l2{background:#f0ad4e;}
.l3{background:#ffd54f;color:#222;}
.l4{background:#5cb85c;}
.l5{background:#0275d8;}

.main{
display:flex;
padding:30px 50px;
gap:40px;
}

.tank{
width:450px;
height:380px;
border-radius:20px;
border:6px solid #0077cc;
position:relative;
overflow:hidden;
background:#90caf9;
transition:.5s;
}

.water{
position:absolute;
bottom:0;
width:100%;
height:70%;
background:rgba(0,140,255,.4);
}

.fish{
position:absolute;
left:170px;
top:140px;
font-size:100px;
}

.info{
flex:1;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.ph{
font-size:60px;
font-weight:bold;
color:#0077cc;
}

.info h2{
margin:15px 0;
color:#005fa3;
}

.info p{
font-size:24px;
line-height:1.6;
}

.summary{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#198754;
color:white;
padding:18px 40px;
border-radius:40px;
font-size:24px;
display:none;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
क्षारीयता और pH का संबंध
</div>

<div class="buttons">

<button class="level l1" onclick="showData(0)">बहुत कम</button>
<button class="level l2" onclick="showData(1)">कम</button>
<button class="level l3" onclick="showData(2)">मध्यम</button>
<button class="level l4" onclick="showData(3)">उच्च</button>
<button class="level l5" onclick="showData(4)">बहुत उच्च</button>

</div>

<div class="main">

<div class="tank" id="tank">

<div class="water"></div>

<div class="fish">🐟</div>

</div>

<div class="info">

<div class="ph" id="ph">
7 - 8.5
</div>

<h2 id="title2">
मध्यम क्षारीयता
</h2>

<p id="desc">
यह मत्स्य पालन के लिए सबसे उपयुक्त श्रेणी मानी जाती है।
</p>

</div>

</div>

<div class="summary" id="summary">

🏆 मुख्य सीख: उचित क्षारीयता पानी के pH को स्थिर रखने में मदद करती है और मछलियों के लिए बेहतर वातावरण बनाती है।

</div>

</div>

<script>

let visited=[false,false,false,false,false];

const data=[

{
ph:"5 - 7",
title:"बहुत कम क्षारीयता",
desc:"पानी में pH तेजी से बदल सकता है। मछलियों पर तनाव बढ़ सकता है।",
color:"#ef5350"
},

{
ph:"5 - 7",
title:"कम क्षारीयता",
desc:"pH में उतार-चढ़ाव अधिक हो सकता है। नियमित निगरानी आवश्यक है।",
color:"#ffb74d"
},

{
ph:"7 - 8.5",
title:"मध्यम क्षारीयता",
desc:"यह मत्स्य पालन के लिए सबसे उपयुक्त श्रेणी मानी जाती है।",
color:"#ffee58"
},

{
ph:"7 - 8.5",
title:"उच्च क्षारीयता",
desc:"pH अपेक्षाकृत स्थिर रहता है और जल की बफर क्षमता बेहतर होती है।",
color:"#66bb6a"
},

{
ph:"9 या अधिक",
title:"बहुत उच्च क्षारीयता",
desc:"pH बहुत अधिक हो सकता है, इसलिए नियमित जाँच जरूरी है।",
color:"#42a5f5"
}

];

function showData(i){

visited[i]=true;

document.getElementById("ph").innerHTML=data[i].ph;
document.getElementById("title2").innerHTML=data[i].title;
document.getElementById("desc").innerHTML=data[i].desc;
document.getElementById("tank").style.background=data[i].color;

if(visited.every(v=>v)){
document.getElementById("summary").style.display="block";
}

}

</script>

</body>
</html>
