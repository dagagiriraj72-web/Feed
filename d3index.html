<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Group - Cognitive Bias Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* HARD-LOCKED STORYLINE 16:9 VIEWPORT 
           Constrains layout parameters strictly within 1280x720 to eliminate 
           vertical layout bleed, text clipping, or overlapping regressions.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 1.8rem 3rem 1.2rem 3rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Top Branded Corporate Header Row */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e2dbd5;
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.4rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
        }

        .company-branding {
            font-size: 1.1rem;
            font-weight: 800;
            color: #7b9583;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background-color: rgba(123, 149, 131, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
        }

        /* 2-Column Core Interface Split */
        .workspace-layout {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 2.2rem;
            flex-grow: 1;
            min-height: 0; /* Clear overflow containment barrier */
            margin: 1rem 0;
            align-items: center;
        }

        /* Left Side Selector Menu */
        .bias-menu-column {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            height: 100%;
            justify-content: center;
        }

        .menu-selection-node {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.06);
            border-left: 6px solid #cbd5e1;
            border-radius: 8px;
            padding: 1rem 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .menu-selection-node:hover {
            transform: translateX(4px);
            background-color: #fffdfb;
        }

        /* Geometric Icon Emblems */
        .node-icon-shape {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #7b9583;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            flex-shrink: 0;
            transition: background-color 0.25s ease;
        }

        .node-label-block {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .node-title-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #3d2314;
        }

        .node-status-tag {
            font-size: 0.72rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Selection Status Modifiers */
        .menu-selection-node.active-node {
            background-color: rgba(123, 149, 131, 0.04);
            border-color: #7b9583;
            box-shadow: 0 4px 12px rgba(123, 149, 131, 0.06);
        }
        .menu-selection-node.active-node .node-title-text { color: #5c7564; }

        .menu-selection-node.mastered-node {
            border-left-color: #2a9d8f;
            border-color: #2a9d8f;
            background-color: rgba(42, 157, 143, 0.03);
        }
        .menu-selection-node.mastered-node .node-title-text {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .menu-selection-node.mastered-node .node-icon-shape { background-color: #2a9d8f; }

        /* Right Side Simulator Arena Dashboard */
        .simulation-arena-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(61, 35, 20, 0.08);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 1.8rem 2.2rem;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .arena-interactive-window {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            min-height: 0;
        }

        .arena-header-tag {
            font-size: 0.82rem;
            font-weight: 700;
            color: #7b9583;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
            flex-shrink: 0;
        }

        /* Original textbook explanation block */
        .arena-source-brief {
            font-size: 0.95rem;
            color: #6e5d53;
            line-height: 1.45;
            background-color: #fdfbf9;
            padding: 0.6rem 1rem;
            border-left: 4px solid #7b9583;
            border-radius: 4px;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .arena-scenario-question {
            font-size: 1.18rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.4;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        /* Choice options pipeline container */
        .options-vertical-pipeline {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-grow: 1;
            min-height: 0;
            justify-content: center;
        }

        .choice-btn-node {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 0.9rem 1.2rem;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            text-align: left;
            line-height: 1.4;
            transition: all 0.2s ease;
            width: 100%;
        }

        .choice-btn-node:hover {
            background-color: #fbf9f6;
            border-color: #7b9583;
            color: #5c7564;
            transform: translateX(3px);
        }

        /* Success Stage Layout Overlay inside card bounds */
        .victory-stage-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            gap: 0.6rem;
        }

        .victory-heading-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2a9d8f;
        }

        /* Bottom Fixed Corporate Metrics Row */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.08);
            padding-top: 0.6rem;
        }

        .score-tracker-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3d2314;
            background-color: #fff8eb;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            border: 1px solid #f4a261;
            font-variant-numeric: tabular-nums;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="slide-wrapper">
        <div class="header-section">
            <h1 class="main-title">Cognitive Biases That Derail Decisions</h1>
            <span class="company-branding">IB Group</span>
        </div>

        <div class="workspace-layout">
            
            <div class="bias-menu-column" id="menu-container">
                <div class="menu-selection-node active-node" id="node-0" onclick="shiftBiasModule(0)">
                    <div class="node-icon-shape">⚓</div>
                    <div class="node-label-block">
                        <span class="node-title-text">Anchoring</span>
                        <span class="node-status-tag" id="badge-0">Active Challenge</span>
                    </div>
                </div>

                <div class="menu-selection-node" id="node-1" onclick="shiftBiasModule(1)">
                    <div class="node-icon-shape">✓</div>
                    <div class="node-label-block">
                        <span class="node-title-text">Confirmation Bias</span>
                        <span class="node-status-tag" id="badge-1">Pending</span>
                    </div>
                </div>

                <div class="menu-selection-node" id="node-2" onclick="shiftBiasModule(2)">
                    <div class="node-icon-shape">★</div>
                    <div class="node-label-block">
                        <span class="node-title-text">Availability Bias</span>
                        <span class="node-status-tag" id="badge-2">Pending</span>
                    </div>
                </div>
            </div>
