<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Research Findings</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;
background:#f4f5f8;
display:flex;
justify-content:center;
align-items:center;
}

#slide{
width:1280px;
height:720px;
background:#f4f5f8;
padding:25px 35px;
overflow:hidden;
}

h1{
font-size:44px;
font-weight:800;
color:#1f235d;
text-align:center;
margin-bottom:20px;
}

.container{
display:flex;
gap:25px;
height:560px;
}

/* LEFT SIDE */

.cards{
width:360px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
height:160px;
background:white;
border:none;
cursor:pointer;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
box-shadow:0 4px 12px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card.active{
background:#4d8fe3;
color:white;
}

.big{
font-size:72px;
font-weight:800;
line-height:1;
}

.label{
font-size:20px;
font-weight:700;
margin-top:10px;
}

/* RIGHT SIDE */

.details{
flex:1;
background:white;
border-radius:20px;
padding:35px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
}

.badge{
display:inline-block;
padding:10px 18px;
border-radius:30px;
background:#eaf1ff;
color:#4d8fe3;
font-weight:700;
margin-bottom:20px;
width:max-content;
}

#title{
font-size:56px;
font-weight:800;
color:#4d8fe3;
margin-bottom:20px;
}

#desc{
font-size:30px;
line-height:1.5;
color:#374151;
}

.source{
margin-top:auto;
font-size:18px;
color:#6b7280;
border-top:1px solid #e5e7eb;
padding-top:15px;
}
</style>
</head>

<body>

<div id="slide">

<h1>Key Research Findings</h1>

<div class="container">

<div class="cards">

<button class="card active" onclick="showFinding(0,this)">
<div class="big">5x</div>
<div class="label">Engagement</div>
</button>

<button class="card" onclick="showFinding(1,this)">
<div class="big">2x</div>
<div class="label">Promotion Rate</div>
</button>

<button class="card" onclick="showFinding(2,this)">
<div class="big">CCL</div>
<div class="label">Leadership Study</div>
</button>

</div>

<div class="details">

<div class="badge">Research Insight</div>

<div id="title">5x</div>

<div id="desc">
Executives with high learning agility are five times more likely to be highly engaged.
</div>

</div>

</div>

</div>

<script>

const findings=[

{
title:"5x",
desc:"Executives with high learning agility are five times more likely to be highly engaged."
},

{
title:"2x",
desc:"Learning-agile individuals are promoted at roughly twice the rate of their peers."
},

{
title:"CCL",
desc:"Center for Creative Leadership research shows that leaders who cling to entrenched patterns are more likely to derail, while agile learners succeed."
}

];

function showFinding(index,btn){

document.getElementById("title").innerText=findings[index].title;
document.getElementById("desc").innerText=findings[index].desc;

document.querySelectorAll(".card").forEach(card=>{
card.classList.remove("active");
});

btn.classList.add("active");
}

</script>

</body>
</html>
