<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Way Door Decisions - Fixed Mechanical Hangar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 PRESENTATION CANVAS FOOTPRINT 
           Locks bounds at 1280x720 to eliminate layout shifts or vertical text bleeding.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 2.2rem 3.5rem 1.5rem 3.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Title Header */
        .header-section {
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.6rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-bottom: 0.4rem;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 4px;
            background-color: #4a584d;
            border-radius: 2px;
        }

        /* Twin-Column Hangar Grid Matrix Workspace */
        .hangar-deck-workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            flex-grow: 1;
            min-height: 0; /* Clear overflow containment shield */
            margin: 1.5rem 0;
            align-items: stretch;
        }

        /* Interactive Door Container Shutter */
        .door-bay-frame {
            background-color: #f1ede9;
            border-radius: 12px;
            border: 1px solid rgba(61, 35, 20, 0.06);
            position: relative;
            perspective: 1200px; /* Activates structural 3D deep rotation swing */
            cursor: pointer;
            height: 100%;
        }

        /* PROTECTED DATA TERMINAL PANEL (Sits Behind Shutter Cover) */
        .internal-data-terminal {
            padding: 2rem 2.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            justify-content: center;
            opacity: 0.2;
            transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; /* Prevents text highlights from snapping clicks */
        }

        .terminal-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: #3d2314;
            border-bottom: 2px solid rgba(61, 35, 20, 0.08);
            padding-bottom: 0.4rem;
        }

        .terminal-bullet-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .terminal-bullet-node {
            font-size: 1.05rem;
            color: #4a382c;
            font-weight: 600;
            line-height: 1.45;
            position: relative;
            padding-left: 1.4rem;
        }

        .terminal-bullet-node::before {
            content: "•";
            color: #4a584d;
            font-weight: bold;
            font-size: 1.4rem;
            position: absolute;
            left: 2px;
            top: -2px;
        }

        /* 3D MECHANICAL OVERLAY COVER SHUTTER (THE DOOR) */
        .mechanical-door-shutter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3a443d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, filter 0.2s ease;
            backface-visibility: hidden;
        }

        .left-bay .mechanical-door-shutter {
            border-radius: 11px;
            transform-origin: left center; /* Hinges door securely to outer screen wing */
            background-image: linear-gradient(135deg, #3a443d 0%, #2f3832 100%);
            border-right: 3px solid rgba(255,255,255,0.08);
        }

        .right-bay .mechanical-door-shutter {
            border-radius: 11px;
            transform-origin: right center; /* Hinges door securely to right screen wing */
            background-image: linear-gradient(225deg, #4c5a4f 0%, #3a443d 100%);
            border-left: 3px solid rgba(255,255,255,0.08);
        }

        .door-bay-frame:hover .mechanical-door-shutter {
            filter: brightness(1.05);
        }

        .door-graphics-icon {
            font-size: 3.2rem;
            margin-bottom: 0.5rem;
        }

        .door-shutter-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .door-shutter-prompt {
            font-size: 0.85rem;
            font-weight: 700;
            color: #a9bfae;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            background-color: rgba(0,0,0,0.1);
        }

        /* WORKING DIRECT ROTATION TRIGGER STATES 
           Triggered instantly and reliably via custom element method calls.
        */
        .left-bay.state-open .mechanical-door-shutter {
            transform: rotateY(-110deg);
            opacity: 0;
        }

        .right-bay.state-open .mechanical-door-shutter {
            transform: rotateY(110deg);
            opacity: 0;
        }

        .door-bay-frame.state-open .internal-data-terminal {
            opacity: 1;
        }

        /* Static Shared Baseline Context Banner Box */
        .insight-banner-row {
            background-color: #fff8eb;
            border: 1px solid #f4a261;
            border-left: 4px solid #f4a261;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.92rem;
            color: #3d2314;
            line-height: 1.4;
            flex-shrink: 0;
            margin-top: 0.4rem;
        }

        /* Bottom Guidance Info Row Strip */
        .footer-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="slide-wrapper">
        <div class="header-section">
            <h1 class="main-title">Two-Way Door Decisions</h1>
        </div>

        <div class="hangar-deck-workspace">
            
            <div class="door-bay-frame left-bay" onclick="this.classList.toggle('state-open')">
                <div class="mechanical-door-shutter">
                    <span class="door-graphics-icon">🚪🔒</span>
                    <h2 class="door-shutter-title">One-Way Doors</h2>
                    <span class="door-shutter-prompt">Engage Shutter</span>
                </div>
                <div class="internal-data-terminal">
                    <h2 class="terminal-heading">One-Way Doors</h2>
                    <ul class="terminal-bullet-list">
                        <li class="terminal-bullet-node">Irreversible or extremely costly to undo</li>
                        <li class="terminal-bullet-node">Require thorough analysis and deliberation</li>
                        <li class="terminal-bullet-node">Examples
