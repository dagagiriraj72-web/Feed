<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>तालाब के लिए सही pH चुनें</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nirmala UI',sans-serif;
}

body{
overflow:hidden;
background:#dff5ff;
}

.container{
width:1280px;
height:720px;
margin:auto;
background:linear-gradient(#eef9ff,#d7efff);
position:relative;
}

.title{
text-align:center;
padding:20px;
font-size:42px;
font-weight:bold;
color:#005ea8;
}

.subtitle{
text-align:center;
font-size:20px;
color:#444;
}

.main{
display:flex;
padding:25px 40px;
gap:30px;
}

/* LEFT */

.pond{
width:500px;
height:420px;
background:linear-gradient(#78cfff,#0094ff);
border-radius:25px;
position:relative;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.water{
position:absolute;
bottom:0;
height:75%;
width:100%;
background:rgba(0,120,255,.35);
}

.fish{
position:absolute;
left:180px;
top:140px;
font-size:120px;
transition:.5s;
}

.phDisplay{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
background:white;
padding:12px 25px;
border-radius:15px;
font-size:36px;
font-weight:bold;
}

/* RIGHT */

.panel{
flex:1;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.sliderBox{
margin-bottom:25px;
}

input[type=range]{
width:100%;
}

.status{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#f2f8ff;
padding:18px;
border-radius:15px;
}

.card h3{
color:#005ea8;
margin-bottom:8px;
}

.card p{
font-size:20px;
}

/* SUMMARY */

.summary{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;
background:#198754;
color:white;
padding:15px;
border-radius:50px;
text-align:center;
font-size:22px;
display:none;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
तालाब के लिए सही pH चुनें
</div>

<div class="subtitle">
स्लाइडर को खिसकाकर विभिन्न pH स्तरों का प्रभाव देखें
</div>

<div class="main">

<div class="pond" id="pond">

<div class="phDisplay">
pH = <span id="phValue">7.5</span>
</div>

<div class="water"></div>

<div class="fish" id="fish">
🐟
</div>

</div>

<div class="panel">

<div class="sliderBox">

<h2>pH स्तर चुनें</h2>
<br>

<input
type="range"
min="0"
max="14"
step="0.1"
value="7.5"
oninput="updatePH(this.value)"
>

</div>

<div class="status">

<div class="card">
<h3>🐟 मछली स्वास्थ्य</h3>
<p id="health">उत्तम</p>
</div>

<div class="card">
<h3>📈 उत्पादन</h3>
<p id="production">अधिक</p>
</div>

<div class="card">
<h3>🥚 प्रजनन</h3>
<p id="reproduction">अच्छा</p>
</div>

<div class="card">
<h3>💡 सुझाव</h3>
<p id="advice">आदर्श सीमा</p>
</div>

</div>

</div>

</div>

<div class="summary" id="summary">

🏆 आदर्श pH सीमा 6.5 से 8.5 है। इसी सीमा में मछलियों की वृद्धि, स्वास्थ्य और उत्पादन सबसे बेहतर रहता है।

</div>

</div>

<script>

function updatePH(value){

value=parseFloat(value);

document.getElementById("phValue").innerHTML=value.toFixed(1);

let health="";
let production="";
let reproduction="";
let advice="";
let color="";

if(value<4.5){

health="गंभीर खतरा";
production="नहीं";
reproduction="संभव नहीं";
advice="बहुत अम्लीय पानी";
color="#ff4d4d";

}

else if(value<6.5){

health="कमज़ोर";
production="कम";
reproduction="प्रभावित";
advice="सुधार आवश्यक";
color="#ffb84d";

}

else if(value<=8.5){

health="उत्तम";
production="अधिक";
reproduction="अच्छा";
advice="आदर्श सीमा";
color="#00aaff";

document.getElementById("summary")
.style.display="block";

}

else if(value<11){

health="तनावग्रस्त";
production="घटता हुआ";
reproduction="प्रभावित";
advice="pH अधिक है";
color="#ffd24d";

}

else{

health="गंभीर खतरा";
production="नहीं";
reproduction="संभव नहीं";
advice="बहुत क्षारीय पानी";
color="#ff4d4d";

}

document.getElementById("health").innerHTML=health;
document.getElementById("production").innerHTML=production;
document.getElementById("reproduction").innerHTML=reproduction;
document.getElementById("advice").innerHTML=advice;

document.getElementById("pond").style.background=
`linear-gradient(${color},#0094ff)`;

if(value<6.5 || value>8.5){

document.getElementById("summary")
.style.display="none";

}

}

</script>

</body>
</html>
