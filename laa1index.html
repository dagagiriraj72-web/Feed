<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Learning Ability vs Learning Agility</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#f4f6fb;
}

.container{
width:1280px;
height:720px;
margin:auto;
padding:12px;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
text-align:center;
margin-bottom:10px;
}

.header h1{
font-size:28px;
font-weight:800;
color:#173b8c;
}

.header p{
font-size:13px;
color:#666;
}

/* TABS */

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:10px;
}

.tab{
padding:10px 25px;
border-radius:30px;
background:white;
border:2px solid #dbe4f3;
cursor:pointer;
font-weight:700;
font-size:16px;
transition:.3s;
}

.tab.active{
background:#4f88da;
color:white;
}

/* QUOTE */

.quote{
height:70px;
background:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
color:#4f88da;
margin-bottom:10px;
border:2px solid #dbe4f3;
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:10px;
}

.card{
height:85px;
background:white;
border-radius:12px;
padding:12px;
cursor:pointer;
border-left:5px solid #4f88da;
transition:.3s;
}

.card:hover{
transform:translateY(-3px);
}

.card h3{
font-size:16px;
color:#173b8c;
margin-bottom:4px;
}

.card p{
font-size:12px;
color:#666;
}

/* DETAIL PANEL */

.detail{
flex:1;
background:white;
border-radius:12px;
padding:18px;
border:2px solid #dbe4f3;
overflow:hidden;
}

.detail h2{
font-size:20px;
color:#173b8c;
margin-bottom:8px;
}

.detail p{
font-size:15px;
line-height:1.6;
color:#444;
}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>Learning Ability vs Learning Agility</h1>
<p>Click a category and explore the concepts</p>
</div>

<div class="tabs">
<div class="tab active" onclick="loadContent('ability',this)">🧠 Ability</div>
<div class="tab" onclick="loadContent('agility',this)">🚀 Agility</div>
</div>

<div class="quote" id="quote">
"How quickly you learn"
</div>

<div class="cards" id="cards"></div>

<div class="detail">
<h2 id="detailTitle">Select a card</h2>
<p id="detailText">
Click any card above to view details.
</p>
</div>

</div>

<script>

const data={

ability:{
quote:'"How quickly you learn"',
cards:[
{
title:"Cognitive Intelligence",
short:"IQ and mental capability",
detail:"Reflects an individual's ability to reason, analyze information and solve problems efficiently."
},
{
title:"Fast Learning",
short:"Absorbing information quickly",
detail:"The speed at which a person can understand and retain new information."
},
{
title:"Academic Capacity",
short:"Knowledge acquisition",
detail:"Ability to perform well in structured learning environments and formal education."
},
{
title:"Analytical Thinking",
short:"Breaking down problems",
detail:"Using logic and evidence to evaluate situations and make decisions."
}
]
},

agility:{
quote:'"What you do when you don’t know what to do"',
cards:[
{
title:"Pattern Recognition",
short:"Connecting experiences",
detail:"Recognizing similarities between situations and applying lessons from the past."
},
{
title:"Problem Solving",
short:"Handling uncertainty",
detail:"Developing practical solutions in unfamiliar and changing environments."
},
{
title:"Knowledge Transfer",
short:"Applying learning",
detail:"Using knowledge gained in one context successfully in another."
},
{
title:"Adaptive Thinking",
short:"Changing approach",
detail:"Adjusting strategies and behaviors when conditions evolve."
}
]
}

};

function loadContent(type,element){

document.querySelectorAll(".tab").forEach(t=>{
t.classList.remove("active");
});

element.classList.add("active");

document.getElementById("quote").innerHTML=data[type].quote;

let html="";

data[type].cards.forEach(card=>{

html+=`
<div class="card"
onclick="showDetail(
'${card.title}',
'${card.detail}'
)">
<h3>${card.title}</h3>
<p>${card.short}</p>
</div>
`;

});

document.getElementById("cards").innerHTML=html;

document.getElementById("detailTitle").innerHTML="Select a card";
document.getElementById("detailText").innerHTML="Click any card above to view details.";

}

function showDetail(title,text){

document.getElementById("detailTitle").innerHTML=title;
document.getElementById("detailText").innerHTML=text;

}

loadContent('ability');

</script>

</body>
</html>
