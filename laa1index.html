<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learning Ability vs Learning Agility</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#eef2f7;
overflow:hidden;
}

#slide{
width:1280px;
height:720px;
margin:auto;
padding:15px;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
height:70px;
text-align:center;
}

.header h1{
font-size:34px;
font-weight:800;
color:#183a8f;
}

.header p{
font-size:14px;
color:#666;
}

/* TOP NAV */

.tabs{
height:60px;
display:flex;
justify-content:center;
gap:15px;
align-items:center;
}

.tab{
width:180px;
height:48px;
border-radius:50px;
border:none;
cursor:pointer;
font-size:18px;
font-weight:700;
transition:.3s;
}

.active-tab{
background:#4c84da;
color:white;
}

.inactive-tab{
background:white;
border:2px solid #d9e3f3;
}

/* MAIN */

.main{
flex:1;
display:flex;
gap:15px;
margin-top:10px;
}

/* LEFT */

.left{
width:320px;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.quote{
font-size:28px;
font-weight:800;
color:#4c84da;
line-height:1.2;
margin-bottom:20px;
}

.desc{
font-size:15px;
line-height:1.6;
color:#444;
}

/* RIGHT */

.right{
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:15px;
}

/* CARD */

.card{
background:white;
border-radius:18px;
padding:18px;
cursor:pointer;
border-left:6px solid #4c84da;
transition:.25s;
box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
font-size:20px;
color:#183a8f;
margin-bottom:8px;
}

.card p{
font-size:14px;
color:#666;
}

/* POPUP */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
}

.popup{
width:600px;
background:white;
border-radius:20px;
padding:30px;
}

.popup h2{
color:#183a8f;
margin-bottom:10px;
}

.popup p{
line-height:1.8;
font-size:17px;
color:#444;
}

.close{
margin-top:20px;
padding:10px 25px;
background:#4c84da;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
}

</style>
</head>
<body>

<div id="slide">

<div class="header">
<h1>Learning Ability vs Learning Agility</h1>
<p>Explore the differences</p>
</div>

<div class="tabs">
<button id="abilityBtn" class="tab active-tab">🧠 Ability</button>
<button id="agilityBtn" class="tab inactive-tab">🚀 Agility</button>
</div>

<div class="main">

<div class="left">

<div class="quote" id="quote">
"How quickly you learn"
</div>

<div class="desc" id="description">
Learning Ability reflects how efficiently a person absorbs, understands and processes information.
</div>

</div>

<div class="right" id="cardArea">

</div>

</div>

</div>

<div class="overlay" id="overlay">
<div class="popup">

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

<button class="close" onclick="closePopup()">
Close
</button>

</div>
</div>

<script>

const data={

ability:{
quote:'"How quickly you learn"',
desc:'Learning Ability reflects how efficiently a person absorbs, understands and processes information.',
cards:[
{
title:'Cognitive Intelligence',
sub:'IQ and reasoning ability',
detail:'Represents intellectual capability used to analyze, understand and solve problems.'
},
{
title:'Fast Learning',
sub:'Quick information absorption',
detail:'The speed at which a learner understands and retains new information.'
},
{
title:'Academic Capacity',
sub:'Knowledge acquisition',
detail:'Ability to perform in structured learning environments.'
},
{
title:'Analytical Thinking',
sub:'Breaking down problems',
detail:'Using logic and evidence to reach conclusions.'
}
]
},

agility:{
quote:'"What you do when you do not know what to do"',
desc:'Learning Agility is the ability to adapt and succeed in unfamiliar situations.',
cards:[
{
title:'Pattern Recognition',
sub:'Connecting experiences',
detail:'Recognizing useful similarities between situations.'
},
{
title:'Problem Solving',
sub:'Handling uncertainty',
detail:'Developing solutions in unfamiliar conditions.'
},
{
title:'Knowledge Transfer',
sub:'Applying lessons',
detail:'Using previous learning in new contexts.'
},
{
title:'Adaptive Thinking',
sub:'Changing approaches',
detail:'Adjusting behavior and strategy when needed.'
}
]
}

};

function load(type){

document.getElementById('quote').innerHTML=data[type].quote;
document.getElementById('description').innerHTML=data[type].desc;

let html='';

data[type].cards.forEach(card=>{

html+=`
<div class="card"
onclick="showPopup(
'${card.title}',
'${card.detail}'
)">
<h3>${card.title}</h3>
<p>${card.sub}</p>
</div>
`;

});

document.getElementById('cardArea').innerHTML=html;
}

function showPopup(title,text){

document.getElementById('popupTitle').innerHTML=title;
document.getElementById('popupText').innerHTML=text;

document.getElementById('overlay').style.display='flex';

}

function closePopup(){
document.getElementById('overlay').style.display='none';
}

document.getElementById('abilityBtn').onclick=function(){

this.className='tab active-tab';
document.getElementById('agilityBtn').className='tab inactive-tab';

load('ability');
}

document.getElementById('agilityBtn').onclick=function(){

this.className='tab active-tab';
document.getElementById('abilityBtn').className='tab inactive-tab';

load('agility');
}

load('ability');

</script>

</body>
</html>
