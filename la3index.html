<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burke Learning Agility Inventory</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;
background:#f4f5f8;
display:flex;
justify-content:center;
align-items:center;
}

#slide{
width:1280px;
height:720px;
background:#f4f5f8;
overflow:hidden;
position:relative;
padding:15px;
}

/* HEADER */

.title{
font-size:34px;
font-weight:800;
color:#1d1b5d;
text-align:center;
}

.subtitle{
font-size:15px;
text-align:center;
color:#8b92a6;
font-style:italic;
margin-top:4px;
margin-bottom:12px;
}

/* PROGRESS */

.progressBox{
position:absolute;
top:15px;
right:20px;
width:180px;
}

.progressLabel{
font-size:14px;
font-weight:700;
text-align:right;
color:#1d1b5d;
margin-bottom:5px;
}

.progressBar{
height:10px;
background:#d8dceb;
border-radius:20px;
overflow:hidden;
}

.progressFill{
height:100%;
width:0%;
background:linear-gradient(90deg,#7c4dff,#3b82f6);
transition:.4s;
}

/* GRID */

.grid{
margin-top:15px;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(3,1fr);
gap:15px;
height:560px;
}

.card{
background:#dde3ef;
border:none;
border-left:8px solid #7c4dff;
border-radius:12px;
padding:18px;
cursor:pointer;
text-align:left;
transition:.25s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.card.visited{
border-left-color:#00c853;
}

.card h3{
font-size:24px;
font-weight:800;
color:#1d1b5d;
margin-bottom:12px;
}

.card p{
font-size:17px;
line-height:1.4;
color:#4b5563;
}

/* POPUP */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.65);
display:none;
z-index:100;
}

.popup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:700px;
background:white;
border-radius:18px;
padding:30px;
display:none;
z-index:101;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.badge{
display:inline-block;
padding:8px 14px;
background:#eef2ff;
border-radius:30px;
color:#4f46e5;
font-weight:700;
margin-bottom:15px;
}

.popupTitle{
font-size:34px;
font-weight:800;
color:#1d1b5d;
margin-bottom:10px;
}

.popupDesc{
font-size:20px;
color:#6b7280;
margin-bottom:20px;
}

.section{
font-size:22px;
font-weight:800;
color:#1d1b5d;
margin-bottom:10px;
}

.popup ul{
padding-left:25px;
margin-bottom:20px;
}

.popup li{
font-size:18px;
margin-bottom:8px;
line-height:1.5;
}

.example{
background:#f5f3ff;
padding:15px;
border-radius:12px;
font-size:17px;
line-height:1.5;
}

.closeBtn{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#4f46e5;
color:white;
cursor:pointer;
font-size:16px;
}

/* COMPLETE */

.complete{
position:absolute;
inset:0;
background:rgba(20,20,60,.96);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:200;
}

.complete h2{
font-size:52px;
margin-bottom:15px;
}

.complete p{
font-size:24px;
margin-bottom:20px;
}

.complete button{
padding:12px 28px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="slide">

<div class="title">Burke Learning Agility Inventory</div>
<div class="subtitle">Nine behavioral dimensions that can be measured and developed</div>

<div class="progressBox">
<div class="progressLabel">
Viewed: <span id="count">0</span>/9
</div>

<div class="progressBar">
<div class="progressFill" id="progressFill"></div>
</div>
</div>

<div class="grid">

<button class="card" onclick="showInfo(0,this)">
<h3>Flexibility</h3>
<p>Openness to new ideas and solutions</p>
</button>

<button class="card" onclick="showInfo(1,this)">
<h3>Speed</h3>
<p>Acting quickly to test what works</p>
</button>

<button class="card" onclick="showInfo(2,this)">
<h3>Experimenting</h3>
<p>Trying approaches with unknowns</p>
</button>

<button class="card" onclick="showInfo(3,this)">
<h3>Performance Risk-Taking</h3>
<p>Stepping beyond comfort zones</p>
</button>

<button class="card" onclick="showInfo(4,this)">
<h3>Interpersonal Risk-Taking</h3>
<p>Leaning into tough conversations</p>
</button>

<button class="card" onclick="showInfo(5,this)">
<h3>Collaborating</h3>
<p>Seeking ways to work together</p>
</button>

<button class="card" onclick="showInfo(6,this)">
<h3>Information Gathering</h3>
<p>Using diverse sources frequently</p>
</button>

<button class="card" onclick="showInfo(7,this)">
<h3>Feedback Seeking</h3>
<p>Asking others for honest input</p>
</button>

<button class="card" onclick="showInfo(8,this)">
<h3>Reflecting</h3>
<p>Evaluating one's own actions</p>
</button>

</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">

<div class="badge">Learning Agility Dimension</div>

<div class="popupTitle" id="titleText"></div>

<div class="popupDesc" id="descText"></div>

<div class="section">Key Behaviors</div>

<ul id="behaviorList"></ul>

<div class="section">Workplace Example</div>

<div class="example" id="exampleText"></div>

<button class="closeBtn" onclick="closePopup()">
Continue
</button>

</div>

<div class="complete" id="complete">

<h2>🏆 Learning Agility Master</h2>

<p>
You explored all 9 dimensions.
</p>

<button onclick="location.reload()">
Play Again
</button>

</div>

</div>

<script>

const data=[

["Flexibility","Openness to new ideas and solutions",
["Adapts quickly","Considers alternatives","Welcomes change"],
"A leader changes direction after finding a better solution."],

["Speed","Acting quickly to test what works",
["Makes timely decisions","Acts rapidly","Maintains momentum"],
"A team launches a pilot within days."],

["Experimenting","Trying approaches with unknowns",
["Tests ideas","Learns by doing","Accepts uncertainty"],
"A manager pilots a new process."],

["Performance Risk-Taking","Stepping beyond comfort zones",
["Accepts challenges","Pushes limits","Builds confidence"],
"An employee volunteers to lead a project."],

["Interpersonal Risk-Taking","Leaning into tough conversations",
["Gives feedback","Addresses conflict","Builds trust"],
"A supervisor discusses performance concerns."],

["Collaborating","Seeking ways to work together",
["Builds partnerships","Shares knowledge","Values viewpoints"],
"Teams work together on a customer issue."],

["Information Gathering","Using diverse sources frequently",
["Researches widely","Seeks perspectives","Questions assumptions"],
"A leader gathers employee and customer insights."],

["Feedback Seeking","Asking others for honest input",
["Requests feedback","Listens openly","Improves continuously"],
"An employee asks peers for suggestions."],

["Reflecting","Evaluating one's own actions",
["Reviews outcomes","Identifies lessons","Adjusts behavior"],
"A team conducts a lessons learned review."]
];

let visited=[];

function showInfo(i,card){

document.getElementById("titleText").innerHTML=data[i][0];
document.getElementById("descText").innerHTML=data[i][1];

let list="";
data[i][2].forEach(item=>{
list+=`<li>${item}</li>`;
});

document.getElementById("behaviorList").innerHTML=list;
document.getElementById("exampleText").innerHTML=data[i][3];

document.getElementById("popup").style.display="block";
document.getElementById("overlay").style.display="block";

if(!visited.includes(i)){

visited.push(i);

card.classList.add("visited");

document.getElementById("count").innerHTML=visited.length;

document.getElementById("progressFill").style.width=
(visited.length/9*100)+"%";

if(visited.length===9){

setTimeout(()=>{
document.getElementById("complete").style.display="flex";
},800);

}

}

}

function closePopup(){

document.getElementById("popup").style.display="none";
document.getElementById("overlay").style.display="none";

}

</script>

</body>
</html>
