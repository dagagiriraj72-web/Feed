<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPID in Practice - Storyline Visible Edition</title>
    
    <style>
        /* ==========================================================================
           1. Core Reset & Fixed 16:9 Canvas Constraints (Absolute No-Scroll Gate)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            color: #1a2a3a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 5px;
        }

        /* Fixed 16:9 Presentation Slide Frame Canvas Box Container */
        .slide-container {
            background-color: #fafcfe;
            width: 1280px;
            height: 720px;
            padding: 35px 50px 20px 50px; /* Bounded padding guarantees 100% visibility */
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(18, 52, 86, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; 
        }

        /* ==========================================================================
           2. Slide Header and HUD Metrics Display Panel
           ========================================================================== */
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e1e8f0;
            padding-bottom: 10px;
        }

        .title-group {
            flex: 1;
        }

        .main-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #123456;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1rem;
            color: #6a7b8c;
            margin-top: 3px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .subtitle::before {
            content: "•";
            color: #e67e22;
            font-size: 1.4rem;
        }

        .hud-metrics {
            display: flex;
            gap: 12px;
        }

        .metric-pill {
            background-color: #eaf1f8;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #123456;
            border: 1px solid #ccdbe8;
        }

        /* ==========================================================================
           3. Gameplay Split-Grid Workspace Arena (Zero Vertical Shifting)
           ========================================================================== */
        .gameplay-arena {
            display: flex;
            gap: 35px;
            flex: 1;
            margin: 20px 0 15px 0;
            align-items: stretch;
            height: calc(100% - 135px);
        }

        /* Left Side: Stalled Workflow Challenges Sidebar */
        .challenges-sidebar {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .challenge-node-btn {
            background-color: #ffffff;
            border: 1px solid #e1e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .challenge-node-btn:hover {
            background-color: #f7fafc;
            border-color: #3b75af;
            transform: translateX(4px);
        }

        .challenge-node-btn.active-focus {
            background-color: #ffffff;
            border-color: #e67e22;
            box-shadow: 0 4px 12px rgba(230,126,34,0.08);
            transform: scale(1.01) translateX(4px);
        }

        .challenge-node-btn.optimized {
            background-color: rgba(46, 204, 113, 0.08);
            border-color: #2ecc71;
            color: #27ae60;
            cursor: default;
            pointer-events: none;
            transform: none;
        }

        /* Right Side: Resolution Matrix Workbench Display Pane */
        .resolution-workbench {
            flex: 1.4;
            background-color: #ffffff;
            border: 1px solid #e1e8f0;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            position: relative;
        }

        /* Continuous visibility framework prevents Storyline render drop issues */
        .empty-prompt-view {
            text-align: center;
            color: #6a7b8c;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .empty-prompt-view h2 {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            color: #123456;
            margin-bottom: 8px;
        }

        /* Visibility opacity maps instead of display parameters to guarantee rendering */
        .solution-reveal-view {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.3s ease;
        }

        .solution-row-block {
            border-bottom: 1px solid #f0f4f8;
            padding-bottom: 10px;
        }

        .solution-row-block h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a7b8c;
            margin-bottom: 4px;
        }

        .solution-row-block p {
            font-size: 1.15rem;
            font-weight: 600;
            color: #123456;
        }

        .solution-row-block p.benefit-tag-text {
            color: #3b75af;
            font-weight: 700;
        }

        .apply-framework-btn {
            background-color: #123456;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 22px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
