<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Pillars of Digital Transformation - Interactive Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 PRESENTATION CANVAS MAXIMUM FOOTPRINT 
           Strictly isolates slide boundaries to preserve layout dimensions without cropping.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 1.8rem 2.5rem 1rem 2.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .header-section {
            margin-bottom: 0.4rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.5rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-bottom: 0.3rem;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 4px;
            background-color: #cd674c;
            border-radius: 2px;
        }

        .workspace-matrix {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            margin: 0.6rem 0;
        }

        /* Horizontal Folder Tabs Menu Bar Track */
        .tab-navigation-strip {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.4rem;
            width: 100%;
            flex-shrink: 0;
        }

        .pillar-tab-btn {
            background-color: #e2dbd5;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-bottom: none;
            padding: 0.75rem 0.5rem;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            transition: all 0.2s ease;
        }

        .tab-index-lbl {
            font-size: 0.72rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-title-lbl {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a382c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Active Selected State Tab Accents */
        .pillar-tab-btn.active-tab {
            background-color: #ffffff;
            padding-top: 0.9rem;
            margin-top: -0.15rem;
            box-shadow: 0 -4px 10px rgba(61, 35, 20, 0.03);
            z-index: 2;
        }
        .pillar-tab-btn[data-id="1"].active-tab, .pillar-tab-btn[data-id="3"].active-tab, .pillar-tab-btn[data-id="5"].active-tab { border-top: 4px solid #cd674c; }
        .pillar-tab-btn[data-id="2"].active-tab, .pillar-tab-btn[data-id="4"].active-tab { border-top: 4px solid #7b9583; }

        .pillar-tab-btn.active-tab .tab-title-lbl { color: #cd674c; }
        .pillar-tab-btn.active-tab[data-id="2"] .tab-title-lbl, .pillar-tab-btn.active-tab[data-id="4"] .tab-title-lbl { color: #5c7564; }

        /* Mastered Correctly Solved State Tab Modifier */
        .pillar-tab-btn.mastered-tab {
            border-top: 4px solid #2a9d8f !important;
            background-color: rgba(42, 157, 143, 0.03);
        }
        .pillar-tab-btn.mastered-tab .tab-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .pillar-tab-btn.mastered-tab .tab-index-lbl {
            color: #2a9d8f;
        }
        .pillar-tab-btn.mastered-tab .tab-index-lbl::after {
            content: " ✓";
        }

        /* Unified Simulator Card Display Panel */
        .unified-arena-card {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.08);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 2rem 2.2rem;
            flex-grow: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            top: -1px;
            z-index: 1;
        }

        /* Cohesive Viewport Split Grid */
        .scenario-panel-view {
            display: none; 
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .scenario-panel-view.visible-view {
            display: grid;
        }

        /* Left Side Column: Text Parameters */
        .arena-brief-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .arena-tag-heading {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .panel-data-green .arena-tag-heading { color: #5c7564; }

        .metric-banner-box {
            font-size: 1rem;
            font-weight: 600;
            color: #5c4b3f;
            background-color: #fdfbf9;
            padding: 0.75rem 1.2rem;
            border-left: 4px solid #cd674c;
            border-radius: 4px;
            line-height: 1.4;
        }
        .panel-data-green .metric-banner-box { border-left-color: #7b9583; }

        .challenge-statement-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.45;
        }

        /* Right Side Column: Choice Click Stack */
        .arena-input-column {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .choice-interaction-card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 1.1rem 1.3rem;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            text-align: left;
            line-height: 1.4;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            position: relative;
        }

        .choice-interaction-card:hover {
            background-color: #fffdfb;
            border-color: #cd674c;
            color: #cd674c;
            transform: translateX(3px);
        }
        .panel-data-green .choice-interaction-card:hover {
            border-color: #7b9583;
            color: #5c7564;
        }

        /* L3 Gaming Responsive Interaction States classes */
        .choice-interaction-card.state-correct {
            background-color: #e7f6f4 !important;
            border-color: #2a9d8f !important;
            color: #2a9d8f !important;
            cursor: default;
            transform: none !important;
        }
        
        .choice-interaction-card.state-correct::after {
            content: "✓ Correct Advantage";
            position: absolute;
            right: 1.2rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .choice-interaction-card.state-incorrect {
            background-color: #fdf2f0 !important;
            border-color: #e26d5c !important;
            color: #e26d5c !important;
            animation: errorShake 0.35s ease;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* In-card Inline Success Prompt Row Banner */
        .inline-success-banner {
            display: none;
            background-color: #e7f6f4;
            border: 1px solid #2a9d8f;
            border-left: 4px solid #2a9d8f;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #2a9d8f;
            font-weight: 600;
            margin-top: 0.8rem;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Progress Information Utility Line */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.08);
            padding-top: 0.6rem;
        }

        .score-tracker-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3d2314;
            background-color: #fff8eb;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            border: 1px solid #f4a261;
            font-variant-numeric: tabular-nums;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
