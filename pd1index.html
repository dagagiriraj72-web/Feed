        /* FORCE GLOBAL CONTAINER TO STRETCH TO FULL IFRAME BOUNDS */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fcf8f2;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;

        /* STRICT 16:9 ASPECT RATIO SLIDE VIEWPORT
           Locks coordinates at standard player boundaries to completely neutralize 
           lower margin text bleeding, element crushing, or footer cutoff errors.
        */
        .slide-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96%;
            height: 94%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            padding: 2.2rem 3.5rem 1.5rem 3.5rem;
            background-color: #fdfaf6;

            flex-direction: column;
            justify-content: space-between;

            border-radius: 8px;

        .header-section {

            justify-content: space-between;

            border-bottom: 2px solid #e2dbd5;
            padding-bottom: 0.5rem;
            flex-shrink: 0;

            line-height: 1.1;
