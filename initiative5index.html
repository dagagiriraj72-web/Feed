<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Group - Workplace Initiative Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 STORYLINE CANVAS FOOTPRINT BOUNDARY 
           Locks coordinates strictly at 1280x720 to neutralize lower text bleeding,
           overlapping cards, or responsive layout failures.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 2.2rem 3.5rem 1.5rem 3.5rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Title Header */
        .header-section {
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.6rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-bottom: 0.4rem;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 4px;
            background-color: #cd674c;
            border-radius: 2px;
        }

        /* SIDE-BY-SIDE SIDEBAR INTEGRATION GRID 
           Distributes selection cards and text payload spaces horizontally to eliminate cutoff.
        */
        .workspace-layout {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 2.5rem;
            flex-grow: 1;
            min-height: 0; /* Anti-collapse vertical barrier line */
            margin: 1rem 0;
            align-items: stretch;
        }

        /* Left Side: 2x2 Interactive Selection Grid Cards */
        .initiative-cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .pillar-selection-node {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.06);
            border-radius: 10px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .pillar-selection-node:hover {
            transform: scale(0.985);
            background-color: #fffdfb;
            border-color: #cd674c;
        }

        /* Symbol Graphics Badges (Directly matching image_4c563e.png icons) */
        .node-graphic-icon {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            transition: transform 0.2s ease;
        }
        .pillar-selection-node:hover .node-graphic-icon {
            transform: scale(1.1);
        }

        .node-title-lbl {
            font-size: 1.15rem;
            font-weight: 700;
            color: #3d2314;
            line-height: 1.25;
        }

        .node-status-badge {
            font-size: 0.68rem;
            font-weight: 800;
            color: #8d7d74;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.2rem;
        }

        /* Interactive Target Highlight States Modifier rules */
        .pillar-selection-node.active-node {
            background-color: rgba(205, 103, 76, 0.03);
            border-color: #cd674c;
            box-shadow: inset 0 0 0 2px #cd674c;
        }
        .pillar-selection-node.active-node .node-title-lbl { color: #cd674c; }
        .pillar-selection-node.active-node .node-status-badge { color: #cd674c; }

        .pillar-selection-node.mastered-node {
            border-color: #2a9d8f;
            background-color: rgba(42, 157, 143, 0.03);
            box-shadow: none;
        }
        .pillar-selection-node.mastered-node .node-title-lbl {
            color: #2a9d8f;
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Right Side: Interactive Content Display Terminal */
        .terminal-display-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(61, 35, 20, 0.08);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
            padding: 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            min-height: 0;
        }

        .terminal-interactive-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            min-height: 0;
        }

        .terminal-header-tag {
            font-size: 0.82rem;
            font-weight: 700;
            color: #cd674c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
            flex-shrink: 0;
        }

        /* Textbook Framework Description Box (Loads details instantly on tab click) */
        .terminal-source-brief {
            font-size: 1.05rem;
            color: #6e5d53;
            line-height: 1.45;
            background-color: #fdfbf9;
            padding: 0.75rem 1.2rem;
