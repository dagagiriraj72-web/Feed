<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Compound Effect Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* STORYLINE 16:9 ACCORDANCE LAYOUT CANVAS
           Strictly limits layout to a 1280x720 footprint, removing text overlap 
           and clipping bugs within Articulate Storyline slide containers.
        */
        .slide-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            aspect-ratio: 16 / 9;
            padding: 1.8rem 3rem 1.2rem 3rem;
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* Header Layout Components */
        .header-section {
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 2.6rem;
            color: #3d2314;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-bottom: 0.4rem;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 120px;
            height: 4px;
            background-color: #e07a5f;
            border-radius: 2px;
        }

        .subtitle {
            margin-top: 0.4rem;
            font-size: 1.05rem;
            color: #6e5d53;
            line-height: 1.4;
        }

        /* Twin Column Split Layout Area */
        .workspace-grid {
            display: grid;
            grid-template-columns: 0.851fr 1.15fr;
            gap: 2rem;
            flex-grow: 1;
            min-height: 0; /* Important vertical guardrail lock boundary */
            margin: 0.8rem 0;
            align-items: center;
        }

        /* Left Side Column: Controller Options & Metric Outputs */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.06);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(61, 35, 20, 0.02);
            height: 100%;
            justify-content: center;
        }

        .panel-heading {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3d2314;
            border-bottom: 1px dashed rgba(61, 35, 20, 0.1);
            padding-bottom: 0.4rem;
        }

        .timeline-slider-box {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #6e5d53;
        }

        .current-marker-output {
            font-size: 1.1rem;
            font-weight: 800;
            color: #e07a5f;
            background-color: #fdf0ec;
            padding: 0.1rem 0.6rem;
            border-radius: 4px;
        }

        .html-range-input {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #e2dbd5;
            outline: none;
            cursor: pointer;
        }

        .html-range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e07a5f;
            transition: transform 0.1s ease;
        }

        .html-range-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Numeric Metric Summary Display Grid */
        .metrics-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .metric-card {
            padding: 0.8rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .with-initiative-card {
            background-color: #fdf0ec;
            border-left: 4px solid #e07a5f;
        }

        .without-initiative-card {
            background-color: #f1ede9;
            border-left: 4px solid #6e5d53;
        }

        .metric-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #6e5d53;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: #3d2314;
            font-variant-numeric: tabular-nums;
        }

        /* Right Side Column: SVG Graphic Plot Area Container */
        .visualization-panel {
            background-color: #ffffff;
            border: 1px solid rgba(61, 35, 20, 0.06);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(61, 35, 20, 0.02);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
        }

        .plot-canvas-wrapper {
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            position: relative;
        }

        .svg-chart-element {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Chart Elements Internal Styling */
        .axis-line {
            stroke: #cbd5e1;
            stroke-width: 1.5px;
        }

        .grid-line {
            stroke: #f1f5f9;
            stroke-width: 1px;
        }

        .axis-text {
            font-size: 11px;
            fill: #64748b;
            font-weight: 600;
        }

        /* Path Curves Configuration */
        .curve-path {
            fill: none;
            stroke-width: 3.5px;
            stroke-linecap: round;
            transition: stroke-dasharray 0.1s ease;
        }

        .curve-active {
            stroke: #e07a5f;
        }

        .curve-inactive {
            stroke: #6e5d53;
        }

        /* Live tracking nodes */
        .tracker-dot {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Chart Legends Strip */
        .chart-legends-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding-top: 0.8rem;
            border-top: 1px solid #f1f5f9;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: #475569;
        }

        .legend-indicator {
            width: 18px;
            height: 5px;
            border-radius: 3px;
        }

        /* Footer Utilities Bar */
        .footer-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(61, 35, 20, 0.06);
            padding-top: 0.5rem;
        }

        .instruction-tag {
            font-size: 0.85rem;
            color: #a39389;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="slide-wrapper">
        <div class="header-section">
            <h1 class="main-title">The Compound Effect</h1>
            <p class="subtitle">Small, consistent actions create exponential results over time. Initiative compounds like interest — the earlier you start, the greater the return.</p>
        </div>

        <div class="workspace-grid">
            
            <div class="control-panel">
                <h3 class="panel-heading">Timeline Simulator</h3>
                
                <div class="timeline-slider-box">
                    <div class="slider-header-row">
                        <span class="slider-title">Adjust Tracking Interval</span>
                        <span class="current-marker-output" id="slider-label">Month 1</span>
                    </div>
                    <input type="range" min="0" max="6" value="0" class="html-range-input" id="time-slider" oninput="updateSimulation(this.value)" aria-label="Adjust tracking timeline interval">
                </div>

                <div class="metrics-row">
                    <div class="metric-card with-initiative-card">
                        <span class="metric-label">With Initiative</span>
                        <span class="metric-value" id="val-active">5</span>
                    </div>
                    <div class="metric-card without-inactive-card">
                        <span class="metric-label">No Initiative</span>
                        <span class="metric-value" id="val-inactive">5</span>
                    </div>
                </div>
            </div>

            <div class="visualization-panel">
                <div class="plot-canvas-wrapper">
                    <svg class="svg-chart-element" viewBox="0 0 550 280" id="chart-svg">
                        <line x1="50" y1="230" x2="520" y2="230" class="axis-line" />
                        <line x1="50" y1="20" x2="50" y2="230" class="axis-line" />
                        
                        <line x1="50" y1="177.5" x2="520" y2="177.5" class="grid-line" />
                        <line x1="50" y1="125" x2="520" y2="125" class="grid-line" />
                        <line x1="50" y1="72.5" x2="520" y2="72.5" class="grid-line" />
                        <line x1="50" y1="20" x2="520" y2="20" class="grid-line" />

                        <text x="50" y="248" class="axis-text" text-anchor="middle">M1</text>
                        <text x="128.3" y="248" class="axis-text" text-anchor="middle">M3</text>
                        <text x="206.6" y="248" class="axis-text" text-anchor="middle">M6</text>
                        <text x="285" y="248" class="axis-text" text-anchor="middle">M9</text>
                        <text x="363.3" y="248" class="axis-text" text-anchor="middle">Year 1</text>
                        <text x="441.6" y="248" class="axis-text" text-anchor="middle">Year 2</text>
                        <text x="520" y="248" class="axis-text" text-anchor="middle">Year 3</text>

                        <text x="42" y="234" class="axis-text" text-anchor="end">0</text>
                        <text x="42" y="181.5" class="axis-text" text-anchor="end">100</text>
                        <text x="42" y="129" class="axis-text" text-anchor="end">200</text>
                        <text x="42" y="76.5" class="axis-text" text-anchor="end">300</text>
